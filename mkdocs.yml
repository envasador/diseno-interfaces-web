site_name: Diseño de Interfaces WEB.
site_url: https://envasador.github.io/diseno-interfaces-web/
site_description: Material didáctico del módulo Diseño de Interfaces Web del CFGS Desarrollo de aplicaciones web del IES Rafael Alberti.

theme:
  name: material
  language: es
  logo: assets/sello-safael-alberti-imago-blanco.svg
  favicon: assets/sello-safael-alberti-imago-blanco.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.prune
    - search.highlight
    - content.code.copy
  font: false

extra_css:
  - https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap
  - stylesheets/neobrutal.css

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables

nav:
  - Inicio: index.md

  - Órbita 1:
      - Resumen y entregables: orbitas/orbita1/index.md
      - Hoja de ruta: orbitas/orbita1/00_hoja_de_ruta.md
      - 1. Por qué investigamos antes de diseñar: orbitas/orbita1/01_por_que_investigamos.md
      - "2. Personas: qué son y cómo se construyen": orbitas/orbita1/02_que_es_una_persona.md
      - 3. User flows: orbitas/orbita1/03_user_flows.md
      - 4. Arquitectura de la información y sitemap: orbitas/orbita1/04_arquitectura_informacion.md
      - 5. Del flujo al wireframe: orbitas/orbita1/05_wireframes.md
      - 6. El brief de proyecto y el entregable: orbitas/orbita1/06_brief_y_entregable.md

  - Órbita 2:
    - Resumen y entregables: orbitas/orbita2/index.md
    - 1. Por qué los tokens antes que las pantallas: orbitas/orbita2/01_tokens_antes_que_pantallas.md
