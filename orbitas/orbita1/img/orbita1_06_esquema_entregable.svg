<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>El entregable de la Órbita 1 como capa 0 del design system</title>
  <defs>
    <style>
      .bg         { fill: #ffffff; }
      .txt        { fill: #1F0318; }
      .txt-inv    { fill: #ffffff; }
      .sombra     { fill: #1F0318; }
      .contenedor { fill: #E93456; stroke: #1F0318; stroke-width: 3; }
      .artefacto  { fill: #ffffff; stroke: #1F0318; stroke-width: 2; }
      .changelog  { fill: #FFB8DE; stroke: #1F0318; stroke-width: 2; stroke-dasharray: 6 3; }
      .destino    { fill: #1F0318; stroke: #1F0318; stroke-width: 2; }
      .linea      { stroke: #1F0318; stroke-width: 2; }
      @media (prefers-color-scheme: dark) {
        .bg         { fill: #150911; }
        .txt        { fill: #F5E9EE; }
        .sombra     { fill: #000000; }
        .contenedor { fill: #E93456; stroke: #F5E9EE; }
        .artefacto  { fill: #2A1620; stroke: #F5E9EE; }
        .changelog  { fill: #5C2E44; stroke: #F5E9EE; stroke-dasharray: 6 3; }
        .destino    { fill: #0A0409; stroke: #F5E9EE; }
        .linea      { stroke: #F5E9EE; }
      }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1F0318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="420" class="bg"/>

  <!-- Capa 0 (con sombra dura) -->
  <rect x="46" y="34" width="600" height="196" class="sombra"/>
  <rect x="40" y="28" width="600" height="196" class="contenedor"/>
  <text x="340" y="54" text-anchor="middle" font-size="14" font-weight="700" class="txt-inv">CAPA 0 — INVESTIGACIÓN (ÓRBITA 1)</text>
  <text x="340" y="72" text-anchor="middle" font-size="11" class="txt-inv">FigJam · vinculada al Figma del proyecto</text>

  <!-- Artefactos -->
  <rect x="60"  y="86" width="124" height="60" class="artefacto"/>
  <text x="122" y="108" text-anchor="middle" font-size="12" font-weight="700" class="txt">Brief</text>
  <text x="122" y="126" text-anchor="middle" font-size="10" class="txt">Problema · alcance</text>
  <text x="122" y="141" text-anchor="middle" font-size="10" class="txt">criterios de éxito</text>

  <rect x="202" y="86" width="124" height="60" class="artefacto"/>
  <text x="264" y="108" text-anchor="middle" font-size="12" font-weight="700" class="txt">Personas</text>
  <text x="264" y="126" text-anchor="middle" font-size="10" class="txt">2-3 perfiles</text>
  <text x="264" y="141" text-anchor="middle" font-size="10" class="txt">div. funcional incluida</text>

  <rect x="344" y="86" width="124" height="60" class="artefacto"/>
  <text x="406" y="108" text-anchor="middle" font-size="12" font-weight="700" class="txt">User flows</text>
  <text x="406" y="126" text-anchor="middle" font-size="10" class="txt">Happy path</text>
  <text x="406" y="141" text-anchor="middle" font-size="10" class="txt">+ casos límite</text>

  <rect x="486" y="86" width="124" height="60" class="artefacto"/>
  <text x="548" y="108" text-anchor="middle" font-size="12" font-weight="700" class="txt">Sitemap</text>
  <text x="548" y="126" text-anchor="middle" font-size="10" class="txt">Estructura</text>
  <text x="548" y="141" text-anchor="middle" font-size="10" class="txt">del producto</text>

  <!-- CHANGELOG -->
  <rect x="60" y="162" width="558" height="50" class="changelog"/>
  <text x="339" y="183" text-anchor="middle" font-size="12" font-weight="700" class="txt">CHANGELOG.md</text>
  <text x="339" y="200" text-anchor="middle" font-size="10" class="txt">Trazabilidad de IA desde el primer día · GitHub</text>

  <!-- Flechas -->
  <line x1="264" y1="230" x2="196" y2="280" class="linea" marker-end="url(#arr)"/>
  <line x1="264" y1="230" x2="340" y2="280" class="linea" marker-end="url(#arr)"/>
  <line x1="406" y1="230" x2="480" y2="280" class="linea" marker-end="url(#arr)"/>
  <line x1="406" y1="230" x2="356" y2="280" class="linea" marker-end="url(#arr)"/>

  <!-- Destinos (con sombra dura en rojo) -->
  <rect x="100" y="284" width="190" height="64" fill="#E93456"/>
  <rect x="96"  y="280" width="190" height="64" class="destino"/>
  <text x="191" y="304" text-anchor="middle" font-size="13" font-weight="700" class="txt-inv">Órbitas 2-3</text>
  <text x="191" y="322" text-anchor="middle" font-size="10" class="txt-inv">Tokens y breakpoints</text>
  <text x="191" y="337" text-anchor="middle" font-size="10" class="txt-inv">justificados</text>

  <rect x="304" y="284" width="168" height="64" fill="#E93456"/>
  <rect x="300" y="280" width="168" height="64" class="destino"/>
  <text x="384" y="304" text-anchor="middle" font-size="13" font-weight="700" class="txt-inv">Órbita 4</text>
  <text x="384" y="322" text-anchor="middle" font-size="10" class="txt-inv">Accesibilidad guiada</text>
  <text x="384" y="337" text-anchor="middle" font-size="10" class="txt-inv">por div. funcional</text>

  <rect x="486" y="284" width="160" height="64" fill="#E93456"/>
  <rect x="482" y="280" width="160" height="64" class="destino"/>
  <text x="562" y="304" text-anchor="middle" font-size="13" font-weight="700" class="txt-inv">Órbita 5</text>
  <text x="562" y="322" text-anchor="middle" font-size="10" class="txt-inv">Flows como guión</text>
  <text x="562" y="337" text-anchor="middle" font-size="10" class="txt-inv">del walkthrough</text>

  <text x="340" y="382" text-anchor="middle" font-size="11" class="txt">Los criterios de éxito del brief son los tests de la Órbita 5</text>
</svg>
