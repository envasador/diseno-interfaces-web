<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>El modelo de cajas: el contenido dentro del relleno, el relleno dentro del borde y el borde dentro del margen, con el token del sistema que controla cada capa</title>
<defs><style>
.bg{fill:#ffffff}.txt{fill:#1F0318}.txt-sec{fill:#5C2E44}.sombra{fill:#1F0318}
.caja{fill:#ffffff;stroke:#1F0318;stroke-width:1.5}.sem{fill:#FFB8DE;stroke:#1F0318;stroke-width:1.5}
.suave{fill:#FFE3F1;stroke:#1F0318;stroke-width:1.5}.borde{fill:none;stroke:#1F0318;stroke-width:6}
.discont{fill:none;stroke:#1F0318;stroke-width:1.5;stroke-dasharray:6 4}
.flecha{stroke:#E93456;stroke-width:2;fill:none}.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){.bg{fill:#150911}.txt{fill:#F5E9EE}.txt-sec{fill:#D9B8C8}.sombra{fill:#000000}
.caja{fill:#2A1620;stroke:#F5E9EE}.sem{fill:#5C2E44;stroke:#F5E9EE}.suave{fill:#3A1F2D;stroke:#F5E9EE}.borde{stroke:#F5E9EE}.discont{stroke:#F5E9EE}}
</style>
<marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E93456" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="380" class="bg"/>
<rect x="30" y="40" width="430" height="300" rx="4" class="discont"/>
<text x="42" y="62" font-size="12" font-weight="700" class="txt">margin</text>
<rect x="85" y="85" width="310" height="210" rx="10" class="borde"/>
<rect x="88" y="88" width="304" height="204" rx="8" class="suave"/>
<text x="100" y="110" font-size="12" font-weight="700" class="txt">padding</text>
<rect x="135" y="130" width="210" height="120" rx="4" class="caja"/>
<text x="240" y="186" text-anchor="middle" font-size="13" font-weight="700" class="txt">contenido</text>
<text x="240" y="204" text-anchor="middle" font-size="11" class="txt-sec mono">width × height</text>
<text x="404" y="194" font-size="12" font-weight="700" class="txt">border</text>
<text x="485" y="52" font-size="13" font-weight="700" class="txt">Con tokens</text>
<rect x="489" y="74" width="186" height="38" rx="6" class="sombra"/><rect x="485" y="70" width="186" height="38" rx="6" class="sem"/>
<text x="495" y="85" font-size="11.5" font-weight="700" class="txt">Margen</text><text x="495" y="100" font-size="10" class="txt mono">gap en el contenedor</text>
<rect x="489" y="124" width="186" height="38" rx="6" class="sombra"/><rect x="485" y="120" width="186" height="38" rx="6" class="sem"/>
<text x="495" y="135" font-size="11.5" font-weight="700" class="txt">Borde (1 px)</text><text x="495" y="150" font-size="10" class="txt mono">var(--color-outline)</text>
<rect x="489" y="174" width="186" height="38" rx="6" class="sombra"/><rect x="485" y="170" width="186" height="38" rx="6" class="sem"/>
<text x="495" y="185" font-size="11.5" font-weight="700" class="txt">Esquinas</text><text x="495" y="200" font-size="10" class="txt mono">var(--radius-md)</text>
<rect x="489" y="224" width="186" height="38" rx="6" class="sombra"/><rect x="485" y="220" width="186" height="38" rx="6" class="sem"/>
<text x="495" y="235" font-size="11.5" font-weight="700" class="txt">Relleno</text><text x="495" y="250" font-size="10" class="txt mono">var(--space-4)</text>
<rect x="489" y="274" width="186" height="38" rx="6" class="sombra"/><rect x="485" y="270" width="186" height="38" rx="6" class="sem"/>
<text x="495" y="285" font-size="11.5" font-weight="700" class="txt">Sombra</text><text x="495" y="300" font-size="10" class="txt mono">var(--elevation-1)</text>
<text x="240" y="325" text-anchor="middle" font-size="11" class="txt-sec">Con box-sizing: border-box, width incluye relleno y borde</text>
</svg>