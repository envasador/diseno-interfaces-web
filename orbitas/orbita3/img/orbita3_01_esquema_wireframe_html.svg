<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Un wireframe de la pantalla Elegir hora, con cada zona señalada por el elemento de HTML que le corresponde: header y nav, main con h1, una lista de tarjetas article, un fieldset con botones de opción, un button de envío y footer</title>
<defs><style>
.bg{fill:#ffffff}.txt{fill:#1F0318}.txt-sec{fill:#5C2E44}.sombra{fill:#1F0318}
.caja{fill:#ffffff;stroke:#1F0318;stroke-width:1.5}.sem{fill:#FFB8DE;stroke:#1F0318;stroke-width:1.5}
.suave{fill:#FFE3F1;stroke:#1F0318;stroke-width:1.5}.borde{fill:none;stroke:#1F0318;stroke-width:6}
.discont{fill:none;stroke:#1F0318;stroke-width:1.5;stroke-dasharray:6 4}
.flecha{stroke:#E93456;stroke-width:2;fill:none}.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){.bg{fill:#150911}.txt{fill:#F5E9EE}.txt-sec{fill:#D9B8C8}.sombra{fill:#000000}
.caja{fill:#2A1620;stroke:#F5E9EE}.sem{fill:#5C2E44;stroke:#F5E9EE}.suave{fill:#3A1F2D;stroke:#F5E9EE}.borde{stroke:#F5E9EE}.discont{stroke:#F5E9EE}}
</style>
<marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E93456" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="440" class="bg"/>
<text x="130" y="30" text-anchor="middle" font-size="14" font-weight="700" class="txt">Wireframe</text>
<text x="470" y="30" text-anchor="middle" font-size="14" font-weight="700" class="txt">HTML</text>
<rect x="54" y="44" width="160" height="384" rx="18" class="sombra"/>
<rect x="50" y="40" width="160" height="384" rx="18" class="caja"/>
<rect x="62" y="56" width="136" height="30" rx="5" class="suave"/>
<text x="130" y="75.0" text-anchor="middle" font-size="10.5" class="txt">Logo · Menú</text>
<path d="M204 71.0 L 300 71.0" class="flecha" marker-end="url(#punta)"/>
<rect x="318" y="44.0" width="336" height="38" rx="6" class="sombra"/><rect x="314" y="40.0" width="336" height="38" rx="6" class="caja"/>
<text x="326" y="56.0" font-size="11.5" font-weight="700" class="txt mono">&lt;header&gt; + &lt;nav&gt;</text><text x="326" y="71.0" font-size="10.5" class="txt-sec">las zonas: puntos de referencia</text>
<rect x="62" y="96" width="136" height="22" rx="5" class="sem"/>
<text x="130" y="111.0" text-anchor="middle" font-size="10.5" class="txt">Elegir hora</text>
<path d="M204 107.0 L 300 107.0" class="flecha" marker-end="url(#punta)"/>
<rect x="318" y="92.0" width="336" height="38" rx="6" class="sombra"/><rect x="314" y="88.0" width="336" height="38" rx="6" class="caja"/>
<text x="326" y="104.0" font-size="11.5" font-weight="700" class="txt mono">&lt;main&gt; › &lt;h1&gt;</text><text x="326" y="119.0" font-size="10.5" class="txt-sec">un único título por pantalla</text>
<rect x="62" y="126" width="136" height="44" rx="5" class="caja"/>
<text x="130" y="152.0" text-anchor="middle" font-size="10.5" class="txt">Pista pádel 1</text>
<path d="M204 173 L 300 173" class="flecha" marker-end="url(#punta)"/>
<rect x="318" y="158" width="336" height="38" rx="6" class="sombra"/><rect x="314" y="154" width="336" height="38" rx="6" class="caja"/>
<text x="326" y="170" font-size="11.5" font-weight="700" class="txt mono">&lt;ul&gt; › &lt;li&gt; › &lt;article&gt;</text><text x="326" y="185" font-size="10.5" class="txt-sec">cada tarjeta, un contenido completo</text>
<rect x="62" y="176" width="136" height="44" rx="5" class="caja"/>
<text x="130" y="202.0" text-anchor="middle" font-size="10.5" class="txt">Pista pádel 2</text>
<rect x="62" y="230" width="136" height="70" rx="5" class="suave"/>
<text x="130" y="269.0" text-anchor="middle" font-size="10.5" class="txt">18:00  19:00  20:00</text>
<path d="M204 265.0 L 300 265.0" class="flecha" marker-end="url(#punta)"/>
<rect x="318" y="250.0" width="336" height="38" rx="6" class="sombra"/><rect x="314" y="246.0" width="336" height="38" rx="6" class="caja"/>
<text x="326" y="262.0" font-size="11.5" font-weight="700" class="txt mono">&lt;fieldset&gt; + &lt;legend&gt;</text><text x="326" y="277.0" font-size="10.5" class="txt-sec">horas: &lt;label&gt; con radio</text>
<rect x="62" y="310" width="136" height="34" rx="5" class="sem"/>
<text x="130" y="331.0" text-anchor="middle" font-size="10.5" class="txt">Reservar</text>
<path d="M204 327.0 L 300 327.0" class="flecha" marker-end="url(#punta)"/>
<rect x="318" y="312.0" width="336" height="38" rx="6" class="sombra"/><rect x="314" y="308.0" width="336" height="38" rx="6" class="caja"/>
<text x="326" y="324.0" font-size="11.5" font-weight="700" class="txt mono">&lt;button type="submit"&gt;</text><text x="326" y="339.0" font-size="10.5" class="txt-sec">hace algo: es un botón</text>
<rect x="62" y="386" width="136" height="26" rx="5" class="suave"/>
<text x="130" y="403.0" text-anchor="middle" font-size="10.5" class="txt">Horario · Teléfono</text>
<path d="M204 399.0 L 300 399.0" class="flecha" marker-end="url(#punta)"/>
<rect x="318" y="384.0" width="336" height="38" rx="6" class="sombra"/><rect x="314" y="380.0" width="336" height="38" rx="6" class="caja"/>
<text x="326" y="396.0" font-size="11.5" font-weight="700" class="txt mono">&lt;footer&gt;</text><text x="326" y="411.0" font-size="10.5" class="txt-sec">pie de la página</text>
</svg>