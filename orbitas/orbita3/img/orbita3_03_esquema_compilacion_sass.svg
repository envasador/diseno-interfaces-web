<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Los ficheros parciales de Sass se cargan con @use desde main.scss, el compilador los junta y el navegador solo recibe un main.css</title>
<defs><style>
.bg{fill:#ffffff}.txt{fill:#1F0318}.txt-sec{fill:#5C2E44}.sombra{fill:#1F0318}
.caja{fill:#ffffff;stroke:#1F0318;stroke-width:1.5}.sem{fill:#FFB8DE;stroke:#1F0318;stroke-width:1.5}
.suave{fill:#FFE3F1;stroke:#1F0318;stroke-width:1.5}.borde{fill:none;stroke:#1F0318;stroke-width:6}
.discont{fill:none;stroke:#1F0318;stroke-width:1.5;stroke-dasharray:6 4}
.flecha{stroke:#E93456;stroke-width:2;fill:none}.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){.bg{fill:#150911}.txt{fill:#F5E9EE}.txt-sec{fill:#D9B8C8}.sombra{fill:#000000}
.caja{fill:#2A1620;stroke:#F5E9EE}.sem{fill:#5C2E44;stroke:#F5E9EE}.suave{fill:#3A1F2D;stroke:#F5E9EE}.borde{stroke:#F5E9EE}.discont{stroke:#F5E9EE}}
</style>
<marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E93456" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="330" class="bg"/>
<text x="110" y="40" text-anchor="middle" font-size="14" font-weight="700" class="txt">Parciales</text>
<text x="110" y="56" text-anchor="middle" font-size="11" class="txt-sec">lo que escribes tú</text>
<text x="330" y="40" text-anchor="middle" font-size="14" font-weight="700" class="txt">Compilación</text>
<text x="330" y="56" text-anchor="middle" font-size="11" class="txt-sec">npm run dev / build</text>
<text x="565" y="40" text-anchor="middle" font-size="14" font-weight="700" class="txt">Navegador</text>
<text x="565" y="56" text-anchor="middle" font-size="11" class="txt-sec">lo único que descarga</text>
<rect x="24" y="78" width="176" height="34" rx="6" class="sombra"/><rect x="20" y="74" width="176" height="34" rx="6" class="caja"/>
<text x="30" y="95" font-size="11" class="txt mono">settings/_tokens.scss</text>
<path d="M204 91 C 225 91, 225 167, 246 167" class="flecha" marker-end="url(#punta)"/>
<rect x="24" y="124" width="176" height="34" rx="6" class="sombra"/><rect x="20" y="120" width="176" height="34" rx="6" class="caja"/>
<text x="30" y="141" font-size="11" class="txt mono">tools/_mixins.scss</text>
<path d="M204 137 C 225 137, 225 167, 246 167" class="flecha" marker-end="url(#punta)"/>
<rect x="24" y="170" width="176" height="34" rx="6" class="sombra"/><rect x="20" y="166" width="176" height="34" rx="6" class="caja"/>
<text x="30" y="187" font-size="11" class="txt mono">generic/_reset.scss</text>
<path d="M204 183 C 225 183, 225 167, 246 167" class="flecha" marker-end="url(#punta)"/>
<rect x="24" y="216" width="176" height="34" rx="6" class="sombra"/><rect x="20" y="212" width="176" height="34" rx="6" class="caja"/>
<text x="30" y="233" font-size="11" class="txt mono">components/_button.scss</text>
<path d="M204 229 C 225 229, 225 167, 246 167" class="flecha" marker-end="url(#punta)"/>
<rect x="24" y="262" width="176" height="34" rx="6" class="sombra"/><rect x="20" y="258" width="176" height="34" rx="6" class="caja"/>
<text x="30" y="279" font-size="11" class="txt mono">components/_card.scss</text>
<path d="M204 275 C 225 275, 225 167, 246 167" class="flecha" marker-end="url(#punta)"/>
<rect x="258" y="134" width="150" height="66" rx="6" class="sombra"/><rect x="254" y="130" width="150" height="66" rx="6" class="sem"/>
<text x="329" y="156" text-anchor="middle" font-size="12" font-weight="700" class="txt mono">main.scss</text>
<text x="329" y="174" text-anchor="middle" font-size="10.5" class="txt">@use de cada parcial</text>
<text x="329" y="188" text-anchor="middle" font-size="10.5" class="txt">Dart Sass compila</text>
<path d="M412 163 L 470 163" class="flecha" marker-end="url(#punta)"/>
<rect x="490" y="134" width="150" height="66" rx="6" class="sombra"/><rect x="486" y="130" width="150" height="66" rx="6" class="caja"/>
<text x="561" y="156" text-anchor="middle" font-size="12" font-weight="700" class="txt mono">css/main.css</text>
<text x="561" y="174" text-anchor="middle" font-size="10.5" class="txt">un solo fichero</text>
<text x="561" y="188" text-anchor="middle" font-size="10.5" class="txt">comprimido al publicar</text>
<text x="561" y="232" text-anchor="middle" font-size="11" class="txt-sec mono">&lt;link rel="stylesheet"</text>
<text x="561" y="248" text-anchor="middle" font-size="11" class="txt-sec mono">href="css/main.css"&gt;</text>
<text x="329" y="232" text-anchor="middle" font-size="11" class="txt-sec">Si hay un error, no compila</text>
<text x="329" y="248" text-anchor="middle" font-size="11" class="txt-sec">y te dice el fichero y la línea</text>
</svg>