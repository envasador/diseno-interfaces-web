<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Estados de un botón principal (normal, encima, foco, pulsado, desactivado y cargando) y de un campo de formulario (normal, foco y error) con la paleta del polideportivo en modo claro</title>
  <defs>
    <style>
      .bg  { fill: #ffffff; }
      .txt { fill: #1F0318; }
      .txt-sec { fill: #5C2E44; }
      .lienzo { fill: #F7F7F8; stroke: #1F0318; stroke-width: 1.5; }
      .sombra { fill: #1F0318; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #150911; }
        .txt { fill: #F5E9EE; }
        .txt-sec { fill: #D9B8C8; }
        .lienzo { stroke: #F5E9EE; }
        .sombra { fill: #000000; }
      }
    </style>
  </defs>

  <rect width="680" height="420" class="bg"/>

  <!-- ===== Botón ===== -->
  <text x="30" y="30" font-size="13" font-weight="700" class="txt">Estados del botón principal</text>
  <rect x="34" y="46" width="620" height="120" rx="8" class="sombra"/>
  <rect x="30" y="42" width="620" height="120" rx="8" class="lienzo"/>

  <g font-size="12" font-weight="600" text-anchor="middle">
    <!-- normal -->
    <rect x="46" y="66" width="86" height="44" rx="8" fill="#1A5FB4"/>
    <text x="89" y="93" fill="#FFFFFF">Reservar</text>
    <!-- hover -->
    <rect x="148" y="66" width="86" height="44" rx="8" fill="#164F96"/>
    <text x="191" y="93" fill="#FFFFFF">Reservar</text>
    <!-- foco -->
    <rect x="246" y="62" width="94" height="52" rx="11" fill="none" stroke="#1C1B22" stroke-width="2.5"/>
    <rect x="250" y="66" width="86" height="44" rx="8" fill="#1A5FB4"/>
    <text x="293" y="93" fill="#FFFFFF">Reservar</text>
    <!-- pulsado -->
    <rect x="352" y="66" width="86" height="44" rx="8" fill="#134079"/>
    <text x="395" y="93" fill="#FFFFFF">Reservar</text>
    <!-- desactivado -->
    <rect x="454" y="66" width="86" height="44" rx="8" fill="#D9D9DE"/>
    <text x="497" y="93" fill="#5E5D68">Reservar</text>
    <!-- cargando -->
    <rect x="556" y="66" width="86" height="44" rx="8" fill="#1A5FB4"/>
    <circle cx="572" cy="88" r="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5"/>
    <path d="M572 81 a7 7 0 0 1 7 7" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="585" y="93" fill="#FFFFFF" font-size="11" text-anchor="start">Enviando</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#5E5D68">
    <text x="89" y="134">Normal</text>
    <text x="89" y="148">blue-500</text>
    <text x="191" y="134">Encima</text>
    <text x="191" y="148">blue-600</text>
    <text x="293" y="134">Foco</text>
    <text x="293" y="148">contorno visible</text>
    <text x="395" y="134">Pulsado</text>
    <text x="395" y="148">blue-700</text>
    <text x="497" y="134">Desactivado</text>
    <text x="497" y="148">solo si se explica</text>
    <text x="599" y="134">Cargando</text>
    <text x="599" y="148">evita el doble toque</text>
  </g>

  <!-- ===== Campo ===== -->
  <text x="30" y="204" font-size="13" font-weight="700" class="txt">Estados de un campo de formulario</text>
  <rect x="34" y="220" width="620" height="170" rx="8" class="sombra"/>
  <rect x="30" y="216" width="620" height="170" rx="8" class="lienzo"/>

  <g font-size="12">
    <!-- normal -->
    <text x="50" y="246" font-weight="600" fill="#1C1B22">Teléfono</text>
    <rect x="50" y="254" width="176" height="40" rx="4" fill="#FFFFFF" stroke="#5E5D68" stroke-width="1.5"/>
    <text x="62" y="279" fill="#1C1B22">600 123 456</text>
    <text x="50" y="314" font-size="11" fill="#5E5D68">Normal: etiqueta visible</text>
    <text x="50" y="328" font-size="11" fill="#5E5D68">encima del campo</text>

    <!-- foco -->
    <text x="252" y="246" font-weight="600" fill="#1C1B22">Teléfono</text>
    <rect x="252" y="254" width="176" height="40" rx="4" fill="#FFFFFF" stroke="#1A5FB4" stroke-width="2.5"/>
    <text x="264" y="279" fill="#1C1B22">600 123 4</text>
    <rect x="322" y="266" width="1.5" height="17" fill="#1C1B22"/>
    <text x="252" y="314" font-size="11" fill="#5E5D68">Foco: borde más grueso</text>
    <text x="252" y="328" font-size="11" fill="#5E5D68">y de otro color</text>

    <!-- error -->
    <text x="454" y="246" font-weight="600" fill="#1C1B22">Teléfono</text>
    <rect x="454" y="254" width="176" height="40" rx="4" fill="#FFFFFF" stroke="#C42B2B" stroke-width="2.5"/>
    <text x="466" y="279" fill="#1C1B22">600 12</text>
    <circle cx="461" cy="314" r="7" fill="#C42B2B"/>
    <rect x="460" y="309" width="2" height="6" fill="#FFFFFF"/>
    <rect x="460" y="317" width="2" height="2" fill="#FFFFFF"/>
    <text x="474" y="318" font-size="11" fill="#C42B2B" font-weight="600">Faltan cifras: el teléfono</text>
    <text x="474" y="332" font-size="11" fill="#C42B2B" font-weight="600">tiene 9 números.</text>
    <text x="454" y="356" font-size="11" fill="#5E5D68">Error: color, icono y texto</text>
    <text x="454" y="370" font-size="11" fill="#5E5D68">que explica cómo arreglarlo</text>
  </g>
</svg>
