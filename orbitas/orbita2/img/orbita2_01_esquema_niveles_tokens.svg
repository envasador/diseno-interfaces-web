<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Los dos niveles de tokens: los semánticos apuntan a primitivos distintos en modo claro y en modo oscuro, y las pantallas solo usan semánticos</title>
  <defs>
    <style>
      .bg  { fill: #ffffff; }
      .txt { fill: #1F0318; }
      .txt-sec { fill: #5C2E44; }
      .sombra { fill: #1F0318; }
      .caja { fill: #ffffff; stroke: #1F0318; stroke-width: 1.5; }
      .sem  { fill: #FFB8DE; stroke: #1F0318; stroke-width: 1.5; }
      .marco { stroke: #1F0318; stroke-width: 1.5; }
      .muestra { stroke: #1F0318; stroke-width: 1; }
      .claro  { stroke: #1F0318; stroke-width: 1.5; fill: none; }
      .oscuro { stroke: #E93456; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      .flecha { stroke: #1F0318; stroke-width: 1.5; fill: none; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #150911; }
        .txt { fill: #F5E9EE; }
        .txt-sec { fill: #D9B8C8; }
        .sombra { fill: #000000; }
        .caja { fill: #2A1620; stroke: #F5E9EE; }
        .sem  { fill: #5C2E44; stroke: #F5E9EE; }
        .marco { stroke: #F5E9EE; }
        .muestra { stroke: #F5E9EE; }
        .claro { stroke: #F5E9EE; }
        .flecha { stroke: #F5E9EE; }
      }
    </style>
    <marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#E93456" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="350" class="bg"/>

  <!-- Cabeceras de columna -->
  <text x="105" y="44" text-anchor="middle" font-size="14" font-weight="700" class="txt">Primitivos</text>
  <text x="105" y="60" text-anchor="middle" font-size="11" class="txt-sec">qué valor tiene</text>
  <text x="350" y="44" text-anchor="middle" font-size="14" font-weight="700" class="txt">Semánticos</text>
  <text x="350" y="60" text-anchor="middle" font-size="11" class="txt-sec">para qué sirve</text>
  <text x="570" y="44" text-anchor="middle" font-size="14" font-weight="700" class="txt">Pantallas</text>
  <text x="570" y="60" text-anchor="middle" font-size="11" class="txt-sec">dónde se aplica</text>

  <!-- Conexiones modo claro (líneas continuas) -->
  <path d="M180 88 C 225 88, 225 107, 270 107" class="claro"/>
  <path d="M180 188 C 225 188, 225 172, 270 172" class="claro"/>
  <path d="M180 238 C 225 238, 225 237, 270 237" class="claro"/>

  <!-- Conexiones modo oscuro (líneas discontinuas) -->
  <path d="M180 138 C 225 138, 225 119, 270 119" class="oscuro"/>
  <path d="M180 238 C 220 238, 220 184, 270 184" class="oscuro"/>
  <path d="M180 188 C 220 188, 220 249, 270 249" class="oscuro"/>

  <!-- Primitivos -->
  <rect x="34" y="74" width="146" height="36" rx="6" class="sombra"/>
  <rect x="30" y="70" width="146" height="36" rx="6" class="caja"/>
  <rect x="40" y="78" width="20" height="20" rx="3" fill="#1A5FB4" class="muestra"/>
  <text x="70" y="93" font-size="12" class="txt mono">blue-500</text>

  <rect x="34" y="124" width="146" height="36" rx="6" class="sombra"/>
  <rect x="30" y="120" width="146" height="36" rx="6" class="caja"/>
  <rect x="40" y="128" width="20" height="20" rx="3" fill="#99C1F1" class="muestra"/>
  <text x="70" y="143" font-size="12" class="txt mono">blue-200</text>

  <rect x="34" y="174" width="146" height="36" rx="6" class="sombra"/>
  <rect x="30" y="170" width="146" height="36" rx="6" class="caja"/>
  <rect x="40" y="178" width="20" height="20" rx="3" fill="#F6F5F4" class="muestra"/>
  <text x="70" y="193" font-size="12" class="txt mono">gray-50</text>

  <rect x="34" y="224" width="146" height="36" rx="6" class="sombra"/>
  <rect x="30" y="220" width="146" height="36" rx="6" class="caja"/>
  <rect x="40" y="228" width="20" height="20" rx="3" fill="#1E1E24" class="muestra"/>
  <text x="70" y="243" font-size="12" class="txt mono">gray-900</text>

  <!-- Semánticos -->
  <rect x="274" y="99" width="156" height="36" rx="6" class="sombra"/>
  <rect x="270" y="95" width="156" height="36" rx="6" class="sem"/>
  <text x="348" y="118" text-anchor="middle" font-size="12" font-weight="600" class="txt mono">color-primary</text>

  <rect x="274" y="164" width="156" height="36" rx="6" class="sombra"/>
  <rect x="270" y="160" width="156" height="36" rx="6" class="sem"/>
  <text x="348" y="183" text-anchor="middle" font-size="12" font-weight="600" class="txt mono">color-surface</text>

  <rect x="274" y="229" width="156" height="36" rx="6" class="sombra"/>
  <rect x="270" y="225" width="156" height="36" rx="6" class="sem"/>
  <text x="348" y="248" text-anchor="middle" font-size="12" font-weight="600" class="txt mono">color-on-surface</text>

  <!-- Flecha hacia las pantallas -->
  <path d="M436 178 L 470 178" class="oscuro" style="stroke-dasharray:none" marker-end="url(#punta)"/>

  <!-- Pantalla en modo claro -->
  <text x="520" y="88" text-anchor="middle" font-size="11" font-weight="600" class="txt">Claro</text>
  <rect x="480" y="96" width="80" height="160" rx="10" fill="#F6F5F4" class="marco"/>
  <rect x="490" y="112" width="52" height="7" rx="2" fill="#1E1E24"/>
  <rect x="490" y="127" width="60" height="4" rx="2" fill="#1E1E24"/>
  <rect x="490" y="136" width="44" height="4" rx="2" fill="#1E1E24"/>
  <rect x="490" y="150" width="60" height="44" rx="4" fill="none" stroke="#1E1E24" stroke-width="1"/>
  <rect x="490" y="222" width="60" height="22" rx="4" fill="#1A5FB4"/>

  <!-- Pantalla en modo oscuro -->
  <text x="620" y="88" text-anchor="middle" font-size="11" font-weight="600" class="txt">Oscuro</text>
  <rect x="580" y="96" width="80" height="160" rx="10" fill="#1E1E24" class="marco"/>
  <rect x="590" y="112" width="52" height="7" rx="2" fill="#F6F5F4"/>
  <rect x="590" y="127" width="60" height="4" rx="2" fill="#F6F5F4"/>
  <rect x="590" y="136" width="44" height="4" rx="2" fill="#F6F5F4"/>
  <rect x="590" y="150" width="60" height="44" rx="4" fill="none" stroke="#F6F5F4" stroke-width="1"/>
  <rect x="590" y="222" width="60" height="22" rx="4" fill="#99C1F1"/>

  <text x="570" y="280" text-anchor="middle" font-size="11" class="txt-sec">Los mismos tokens semánticos</text>
  <text x="570" y="294" text-anchor="middle" font-size="11" class="txt-sec">en los dos modos</text>

  <!-- Leyenda -->
  <line x1="30" y1="318" x2="62" y2="318" class="claro"/>
  <text x="70" y="322" font-size="11" class="txt">Modo claro</text>
  <line x1="170" y1="318" x2="202" y2="318" class="oscuro"/>
  <text x="210" y="322" font-size="11" class="txt">Modo oscuro</text>
</svg>
