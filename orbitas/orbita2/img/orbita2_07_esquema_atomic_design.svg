<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Los niveles de Atomic Design aplicados al polideportivo: tokens, átomos, moléculas, organismos, plantillas y páginas</title>
  <defs>
    <style>
      .bg  { fill: #ffffff; }
      .txt { fill: #1F0318; }
      .txt-sec { fill: #5C2E44; }
      .caja { fill: #ffffff; stroke: #1F0318; stroke-width: 1.5; }
      .sombra { fill: #1F0318; }
      .el { fill: #1F0318; }
      .el-suave { fill: #C9B8C1; }
      .flecha { stroke: #E93456; stroke-width: 2; fill: none; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #150911; }
        .txt { fill: #F5E9EE; }
        .txt-sec { fill: #D9B8C8; }
        .caja { fill: #2A1620; stroke: #F5E9EE; }
        .sombra { fill: #000000; }
        .el { fill: #F5E9EE; }
        .el-suave { fill: #6E5563; }
      }
    </style>
    <marker id="ptad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#E93456" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="320" class="bg"/>

  <!-- Cajas de nivel: x = 14 + i*111, ancho 96 -->
  <g>
    <rect x="18" y="48" width="96" height="170" rx="8" class="sombra"/><rect x="14" y="44" width="96" height="170" rx="8" class="caja"/>
    <rect x="129" y="48" width="96" height="170" rx="8" class="sombra"/><rect x="125" y="44" width="96" height="170" rx="8" class="caja"/>
    <rect x="240" y="48" width="96" height="170" rx="8" class="sombra"/><rect x="236" y="44" width="96" height="170" rx="8" class="caja"/>
    <rect x="351" y="48" width="96" height="170" rx="8" class="sombra"/><rect x="347" y="44" width="96" height="170" rx="8" class="caja"/>
    <rect x="462" y="48" width="96" height="170" rx="8" class="sombra"/><rect x="458" y="44" width="96" height="170" rx="8" class="caja"/>
    <rect x="573" y="48" width="96" height="170" rx="8" class="sombra"/><rect x="569" y="44" width="96" height="170" rx="8" class="caja"/>
  </g>

  <!-- Flechas -->
  <path d="M111 130 L 123 130" class="flecha" marker-end="url(#ptad)"/>
  <path d="M222 130 L 234 130" class="flecha" marker-end="url(#ptad)"/>
  <path d="M333 130 L 345 130" class="flecha" marker-end="url(#ptad)"/>
  <path d="M444 130 L 456 130" class="flecha" marker-end="url(#ptad)"/>
  <path d="M555 130 L 567 130" class="flecha" marker-end="url(#ptad)"/>

  <!-- Títulos -->
  <g font-size="12" font-weight="700" text-anchor="middle" class="txt">
    <text x="62" y="32">Tokens</text>
    <text x="173" y="32">Átomos</text>
    <text x="284" y="32">Moléculas</text>
    <text x="395" y="32">Organismos</text>
    <text x="506" y="32">Plantillas</text>
    <text x="617" y="32">Páginas</text>
  </g>

  <!-- Tokens -->
  <rect x="28" y="62" width="18" height="18" rx="3" fill="#1A5FB4"/>
  <rect x="50" y="62" width="18" height="18" rx="3" fill="#99C1F1"/>
  <rect x="72" y="62" width="18" height="18" rx="3" fill="#C42B2B"/>
  <text x="28" y="108" font-size="18" font-weight="700" class="txt">Aa</text>
  <text x="58" y="108" font-size="12" class="txt">Aa</text>
  <rect x="28" y="122" width="4" height="10" fill="#E93456"/>
  <rect x="36" y="122" width="8" height="10" fill="#E93456"/>
  <rect x="48" y="122" width="16" height="10" fill="#E93456"/>
  <rect x="68" y="122" width="24" height="10" fill="#E93456"/>
  <rect x="28" y="146" width="28" height="18" rx="2" fill="none" stroke="#5E5D68" stroke-width="1.2"/>
  <rect x="62" y="146" width="28" height="18" rx="9" fill="none" stroke="#5E5D68" stroke-width="1.2"/>

  <!-- Átomos -->
  <rect x="137" y="62" width="72" height="24" rx="6" fill="#1A5FB4"/>
  <text x="173" y="78" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">Reservar</text>
  <rect x="137" y="96" width="72" height="22" rx="4" fill="#FFFFFF" stroke="#5E5D68" stroke-width="1.2"/>
  <rect x="137" y="128" width="40" height="7" rx="2" class="el"/>
  <circle cx="146" cy="156" r="7" fill="none" stroke="#5E5D68" stroke-width="1.8"/>
  <line x1="151" y1="161" x2="156" y2="166" stroke="#5E5D68" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="166" y="150" width="40" height="14" rx="7" fill="#1E7A3C"/>
  <text x="186" y="160" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">Libre</text>

  <!-- Moléculas: campo completo y buscador -->
  <rect x="248" y="62" width="44" height="6" rx="2" class="el"/>
  <rect x="248" y="72" width="72" height="22" rx="4" fill="#FFFFFF" stroke="#C42B2B" stroke-width="1.8"/>
  <circle cx="252" cy="104" r="4" fill="#C42B2B"/>
  <rect x="260" y="101" width="56" height="5" rx="2" fill="#C42B2B"/>
  <rect x="248" y="130" width="72" height="24" rx="12" fill="#FFFFFF" stroke="#5E5D68" stroke-width="1.2"/>
  <circle cx="261" cy="141" r="5" fill="none" stroke="#5E5D68" stroke-width="1.5"/>
  <rect x="272" y="139" width="36" height="5" rx="2" fill="#9A99A3"/>

  <!-- Organismos: tarjeta de pista -->
  <rect x="357" y="58" width="76" height="110" rx="6" fill="#FFFFFF" stroke="#D9D9DE" stroke-width="1.2"/>
  <rect x="363" y="64" width="64" height="38" rx="3" fill="#99C1F1"/>
  <rect x="363" y="108" width="44" height="6" rx="2" fill="#1C1B22"/>
  <rect x="363" y="118" width="32" height="4" rx="2" fill="#5E5D68"/>
  <rect x="401" y="116" width="26" height="10" rx="5" fill="#1E7A3C"/>
  <rect x="363" y="138" width="64" height="20" rx="5" fill="#1A5FB4"/>

  <!-- Plantillas: estructura vacía -->
  <rect x="478" y="56" width="56" height="140" rx="8" fill="none" stroke="#9A99A3" stroke-width="1.2"/>
  <rect x="484" y="64" width="44" height="10" rx="2" class="el-suave"/>
  <rect x="484" y="80" width="44" height="44" rx="4" fill="none" stroke="#9A99A3" stroke-dasharray="3 2"/>
  <rect x="484" y="130" width="44" height="30" rx="4" fill="none" stroke="#9A99A3" stroke-dasharray="3 2"/>
  <rect x="484" y="176" width="44" height="12" rx="2" class="el-suave"/>

  <!-- Páginas: mockup con contenido real -->
  <rect x="589" y="56" width="56" height="140" rx="8" fill="#F7F7F8" stroke="#1C1B22" stroke-width="1.2"/>
  <rect x="595" y="64" width="36" height="6" rx="2" fill="#1C1B22"/>
  <rect x="595" y="80" width="44" height="44" rx="4" fill="#FFFFFF" stroke="#D9D9DE"/>
  <rect x="599" y="84" width="36" height="18" rx="2" fill="#99C1F1"/>
  <rect x="599" y="106" width="26" height="4" rx="2" fill="#1C1B22"/>
  <rect x="599" y="114" width="36" height="7" rx="3" fill="#1A5FB4"/>
  <rect x="595" y="130" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#D9D9DE"/>
  <rect x="595" y="176" width="44" height="12" rx="2" fill="#1C1B22"/>

  <!-- Descripciones -->
  <g font-size="10" text-anchor="middle" class="txt-sec">
    <text x="62" y="234">Color, letra,</text><text x="62" y="246">espacio, radio</text>
    <text x="173" y="234">Botón, campo,</text><text x="173" y="246">icono, etiqueta</text>
    <text x="284" y="234">Campo con etiqueta</text><text x="284" y="246">y error; buscador</text>
    <text x="395" y="234">Tarjeta de pista,</text><text x="395" y="246">barra de navegación</text>
  </g>
  <g font-size="10" text-anchor="middle" class="txt-sec">
    <text x="506" y="234">Estructura de pantalla</text><text x="506" y="246">sin contenido real</text>
    <text x="617" y="234">Mockup con</text><text x="617" y="246">contenido real</text>
  </g>

  <!-- Correspondencia con las órbitas -->
  <line x1="14" y1="266" x2="110" y2="266" stroke="#E93456" stroke-width="2"/>
  <line x1="125" y1="266" x2="443" y2="266" stroke="#E93456" stroke-width="2"/>
  <line x1="458" y1="266" x2="665" y2="266" stroke="#E93456" stroke-width="2"/>
  <g font-size="11" text-anchor="middle" class="txt">
    <text x="62" y="284">Apartados 3 a 5</text>
    <text x="284" y="284">Apartados 6 y 7 · página «Componentes» de Figma</text>
    <text x="561" y="284">Plantilla de la Órbita 1</text>
    <text x="561" y="300">y mockups del apartado 8</text>
  </g>
</svg>
