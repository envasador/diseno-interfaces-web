<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Cuatro principios de la Gestalt aplicados a una interfaz: proximidad, semejanza, región común y figura y fondo</title>
  <defs>
    <style>
      .bg  { fill: #ffffff; }
      .txt { fill: #1F0318; }
      .txt-sec { fill: #5C2E44; }
      .sombra { fill: #1F0318; }
      .panel { fill: #ffffff; stroke: #1F0318; stroke-width: 1.5; }
      .el  { fill: #1F0318; }
      .el-suave { fill: #C9B8C1; }
      .acento { fill: #E93456; }
      .region { fill: #FFE3F1; stroke: #1F0318; stroke-width: 1; }
      .velo { fill: #1F0318; opacity: 0.45; }
      .tarjeta { fill: #ffffff; stroke: #1F0318; stroke-width: 1.5; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #150911; }
        .txt { fill: #F5E9EE; }
        .txt-sec { fill: #D9B8C8; }
        .sombra { fill: #000000; }
        .panel { fill: #2A1620; stroke: #F5E9EE; }
        .el { fill: #F5E9EE; }
        .el-suave { fill: #6E5563; }
        .region { fill: #5C2E44; stroke: #F5E9EE; }
        .velo { fill: #000000; opacity: 0.55; }
        .tarjeta { fill: #2A1620; stroke: #F5E9EE; }
      }
    </style>
  </defs>

  <rect width="680" height="480" class="bg"/>

  <!-- ===== Panel 1: Proximidad ===== -->
  <rect x="34" y="34" width="300" height="180" rx="8" class="sombra"/>
  <rect x="30" y="30" width="300" height="180" rx="8" class="panel"/>
  <text x="48" y="56" font-size="14" font-weight="700" class="txt">Proximidad</text>
  <!-- Tres grupos de etiqueta + campo: la etiqueta está más cerca de su campo que del campo anterior -->
  <g>
    <rect x="48" y="72" width="70" height="7" rx="2" class="el"/>
    <rect x="48" y="83" width="140" height="18" rx="3" class="el-suave"/>
    <rect x="48" y="117" width="54" height="7" rx="2" class="el"/>
    <rect x="48" y="128" width="140" height="18" rx="3" class="el-suave"/>
    <rect x="48" y="162" width="82" height="7" rx="2" class="el"/>
    <rect x="48" y="173" width="140" height="18" rx="3" class="el-suave"/>
  </g>
  <text x="206" y="98" font-size="11" class="txt-sec">4 px entre</text>
  <text x="206" y="111" font-size="11" class="txt-sec">etiqueta y campo,</text>
  <text x="206" y="124" font-size="11" class="txt-sec">16 px entre</text>
  <text x="206" y="137" font-size="11" class="txt-sec">un campo y</text>
  <text x="206" y="150" font-size="11" class="txt-sec">el siguiente</text>

  <!-- ===== Panel 2: Semejanza ===== -->
  <rect x="354" y="34" width="300" height="180" rx="8" class="sombra"/>
  <rect x="350" y="30" width="300" height="180" rx="8" class="panel"/>
  <text x="368" y="56" font-size="14" font-weight="700" class="txt">Semejanza</text>
  <!-- Cuadrícula de horas: las libres comparten forma y color -->
  <g>
    <rect x="368" y="74" width="54" height="26" rx="13" class="acento"/>
    <rect x="430" y="74" width="54" height="26" rx="13" class="el-suave"/>
    <rect x="492" y="74" width="54" height="26" rx="13" class="acento"/>
    <rect x="554" y="74" width="54" height="26" rx="13" class="acento"/>
    <rect x="368" y="108" width="54" height="26" rx="13" class="el-suave"/>
    <rect x="430" y="108" width="54" height="26" rx="13" class="acento"/>
    <rect x="492" y="108" width="54" height="26" rx="13" class="el-suave"/>
    <rect x="554" y="108" width="54" height="26" rx="13" class="el-suave"/>
  </g>
  <rect x="368" y="152" width="14" height="14" rx="7" class="acento"/>
  <text x="388" y="163" font-size="11" class="txt-sec">Libre: mismo color y forma</text>
  <rect x="368" y="174" width="14" height="14" rx="7" class="el-suave"/>
  <text x="388" y="185" font-size="11" class="txt-sec">Ocupada</text>
  <text x="368" y="203" font-size="10" class="txt-sec">(en la app, además, con la palabra "Libre")</text>

  <!-- ===== Panel 3: Región común ===== -->
  <rect x="34" y="244" width="300" height="180" rx="8" class="sombra"/>
  <rect x="30" y="240" width="300" height="180" rx="8" class="panel"/>
  <text x="48" y="266" font-size="14" font-weight="700" class="txt">Región común</text>
  <!-- Dos tarjetas: lo que está dentro de un mismo fondo se lee como un bloque -->
  <rect x="48" y="280" width="128" height="122" rx="8" class="region"/>
  <rect x="60" y="292" width="104" height="44" rx="4" class="el-suave"/>
  <rect x="60" y="346" width="76" height="7" rx="2" class="el"/>
  <rect x="60" y="360" width="60" height="5" rx="2" class="el-suave"/>
  <rect x="60" y="376" width="56" height="16" rx="4" class="acento"/>
  <rect x="188" y="280" width="128" height="122" rx="8" class="region"/>
  <rect x="200" y="292" width="104" height="44" rx="4" class="el-suave"/>
  <rect x="200" y="346" width="70" height="7" rx="2" class="el"/>
  <rect x="200" y="360" width="64" height="5" rx="2" class="el-suave"/>
  <rect x="200" y="376" width="56" height="16" rx="4" class="acento"/>

  <!-- ===== Panel 4: Figura y fondo ===== -->
  <rect x="354" y="244" width="300" height="180" rx="8" class="sombra"/>
  <rect x="350" y="240" width="300" height="180" rx="8" class="panel"/>
  <text x="368" y="266" font-size="14" font-weight="700" class="txt">Figura y fondo</text>
  <!-- Pantalla al fondo oscurecida y diálogo encima -->
  <g>
    <rect x="368" y="278" width="264" height="128" rx="6" class="el-suave"/>
    <rect x="380" y="290" width="120" height="7" rx="2" class="el"/>
    <rect x="380" y="304" width="200" height="5" rx="2" class="el"/>
    <rect x="380" y="314" width="180" height="5" rx="2" class="el"/>
    <rect x="368" y="278" width="264" height="128" rx="6" class="velo"/>
    <rect x="432" y="306" width="140" height="78" rx="6" class="sombra"/>
    <rect x="428" y="302" width="140" height="78" rx="6" class="tarjeta"/>
    <rect x="440" y="316" width="96" height="7" rx="2" class="el"/>
    <rect x="440" y="330" width="112" height="5" rx="2" class="el-suave"/>
    <rect x="440" y="354" width="52" height="16" rx="4" class="el-suave"/>
    <rect x="500" y="354" width="56" height="16" rx="4" class="acento"/>
  </g>

  <!-- Pies -->
  <text x="30" y="446" font-size="11" class="txt-sec">Lo cercano se agrupa, lo parecido se relaciona, lo que comparte fondo forma un bloque</text>
  <text x="30" y="462" font-size="11" class="txt-sec">y lo que se separa del fondo pasa delante.</text>
</svg>
