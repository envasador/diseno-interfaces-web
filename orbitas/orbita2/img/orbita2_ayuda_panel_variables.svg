<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Organización de las variables en Figma: una colección de primitivos con un solo modo y una colección de semánticos con los modos claro y oscuro, cuyos valores son alias de los primitivos</title>
  <defs>
    <style>
      .bg  { fill: #ffffff; }
      .txt { fill: #1F0318; }
      .txt-sec { fill: #5C2E44; }
      .panel { fill: #ffffff; stroke: #1F0318; stroke-width: 1.5; }
      .sombra { fill: #1F0318; }
      .lateral { fill: #F5E9EE; }
      .sel { fill: #FFB8DE; }
      .linea { stroke: #E3D3DB; stroke-width: 1; }
      .chip { fill: #F5E9EE; stroke: #C9B8C1; stroke-width: 1; }
      .muestra { stroke: #1F0318; stroke-width: 0.8; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #150911; }
        .txt { fill: #F5E9EE; }
        .txt-sec { fill: #D9B8C8; }
        .panel { fill: #2A1620; stroke: #F5E9EE; }
        .sombra { fill: #000000; }
        .lateral { fill: #1E0F17; }
        .sel { fill: #5C2E44; }
        .linea { stroke: #3A2530; }
        .chip { fill: #3A2530; stroke: #6E5563; }
        .muestra { stroke: #F5E9EE; }
      }
    </style>
  </defs>

  <rect width="680" height="400" class="bg"/>

  <rect x="34" y="34" width="620" height="330" rx="8" class="sombra"/>
  <rect x="30" y="30" width="620" height="330" rx="8" class="panel"/>

  <!-- Lateral de colecciones -->
  <rect x="31" y="31" width="150" height="328" rx="7" class="lateral"/>
  <text x="46" y="56" font-size="10" font-weight="700" class="txt-sec">COLECCIONES</text>
  <text x="46" y="82" font-size="12" class="txt">Primitivos</text>
  <text x="46" y="96" font-size="10" class="txt-sec">1 modo · ocultos al publicar</text>
  <rect x="38" y="108" width="136" height="40" rx="5" class="sel"/>
  <text x="46" y="126" font-size="12" font-weight="700" class="txt">Semánticos</text>
  <text x="46" y="140" font-size="10" class="txt-sec">2 modos: Claro y Oscuro</text>
  <text x="46" y="174" font-size="10" font-weight="700" class="txt-sec">GRUPOS</text>
  <text x="46" y="196" font-size="12" class="txt mono">color</text>
  <text x="46" y="216" font-size="12" class="txt mono">space</text>
  <text x="46" y="236" font-size="12" class="txt mono">radius</text>
  <text x="46" y="256" font-size="12" class="txt mono">font</text>

  <!-- Tabla -->
  <text x="200" y="56" font-size="10" font-weight="700" class="txt-sec">NOMBRE</text>
  <text x="390" y="56" font-size="10" font-weight="700" class="txt-sec">CLARO</text>
  <text x="530" y="56" font-size="10" font-weight="700" class="txt-sec">OSCURO</text>
  <line x1="196" y1="66" x2="640" y2="66" class="linea"/>

  <g font-size="12">
    <!-- fila 1 -->
    <text x="200" y="92" class="txt mono">color/primary</text>
    <rect x="386" y="77" width="120" height="22" rx="11" class="chip"/>
    <rect x="392" y="82" width="12" height="12" rx="2" fill="#1A5FB4" class="muestra"/>
    <text x="410" y="92" font-size="11" class="txt mono">blue/500</text>
    <rect x="526" y="77" width="120" height="22" rx="11" class="chip"/>
    <rect x="532" y="82" width="12" height="12" rx="2" fill="#99C1F1" class="muestra"/>
    <text x="550" y="92" font-size="11" class="txt mono">blue/200</text>
    <line x1="196" y1="108" x2="640" y2="108" class="linea"/>

    <!-- fila 2 -->
    <text x="200" y="134" class="txt mono">color/on-primary</text>
    <rect x="386" y="119" width="120" height="22" rx="11" class="chip"/>
    <rect x="392" y="124" width="12" height="12" rx="2" fill="#FFFFFF" class="muestra"/>
    <text x="410" y="134" font-size="11" class="txt mono">white</text>
    <rect x="526" y="119" width="120" height="22" rx="11" class="chip"/>
    <rect x="532" y="124" width="12" height="12" rx="2" fill="#1C1B22" class="muestra"/>
    <text x="550" y="134" font-size="11" class="txt mono">gray/900</text>
    <line x1="196" y1="150" x2="640" y2="150" class="linea"/>

    <!-- fila 3 -->
    <text x="200" y="176" class="txt mono">color/surface</text>
    <rect x="386" y="161" width="120" height="22" rx="11" class="chip"/>
    <rect x="392" y="166" width="12" height="12" rx="2" fill="#F7F7F8" class="muestra"/>
    <text x="410" y="176" font-size="11" class="txt mono">gray/50</text>
    <rect x="526" y="161" width="120" height="22" rx="11" class="chip"/>
    <rect x="532" y="166" width="12" height="12" rx="2" fill="#1C1B22" class="muestra"/>
    <text x="550" y="176" font-size="11" class="txt mono">gray/900</text>
    <line x1="196" y1="192" x2="640" y2="192" class="linea"/>

    <!-- fila 4 -->
    <text x="200" y="218" class="txt mono">color/surface-raised</text>
    <rect x="386" y="203" width="120" height="22" rx="11" class="chip"/>
    <rect x="392" y="208" width="12" height="12" rx="2" fill="#FFFFFF" class="muestra"/>
    <text x="410" y="218" font-size="11" class="txt mono">white</text>
    <rect x="526" y="203" width="120" height="22" rx="11" class="chip"/>
    <rect x="532" y="208" width="12" height="12" rx="2" fill="#2E2D36" class="muestra"/>
    <text x="550" y="218" font-size="11" class="txt mono">gray/800</text>
    <line x1="196" y1="234" x2="640" y2="234" class="linea"/>

    <!-- fila 5 -->
    <text x="200" y="260" class="txt mono">color/on-surface</text>
    <rect x="386" y="245" width="120" height="22" rx="11" class="chip"/>
    <rect x="392" y="250" width="12" height="12" rx="2" fill="#1C1B22" class="muestra"/>
    <text x="410" y="260" font-size="11" class="txt mono">gray/900</text>
    <rect x="526" y="245" width="120" height="22" rx="11" class="chip"/>
    <rect x="532" y="250" width="12" height="12" rx="2" fill="#F7F7F8" class="muestra"/>
    <text x="550" y="260" font-size="11" class="txt mono">gray/50</text>
    <line x1="196" y1="276" x2="640" y2="276" class="linea"/>

    <!-- fila 6 -->
    <text x="200" y="302" class="txt mono">color/error</text>
    <rect x="386" y="287" width="120" height="22" rx="11" class="chip"/>
    <rect x="392" y="292" width="12" height="12" rx="2" fill="#C42B2B" class="muestra"/>
    <text x="410" y="302" font-size="11" class="txt mono">red/600</text>
    <rect x="526" y="287" width="120" height="22" rx="11" class="chip"/>
    <rect x="532" y="292" width="12" height="12" rx="2" fill="#F08A8A" class="muestra"/>
    <text x="550" y="302" font-size="11" class="txt mono">red/300</text>
  </g>

  <text x="200" y="340" font-size="11" class="txt-sec">Cada valor es un alias de un primitivo. En CSS, color/primary será --color-primary.</text>

  <text x="30" y="388" font-size="11" class="txt-sec">Esquema simplificado del panel de variables de Figma (las colecciones y los modos dependen de tu plan).</text>
</svg>
