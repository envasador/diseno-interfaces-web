<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Escala tipográfica de siete niveles con proporción 1,25 sobre una base de 16 píxeles, redondeada a múltiplos de 4</title>
  <defs>
    <style>
      .bg  { fill: #ffffff; }
      .txt { fill: #1F0318; }
      .txt-sec { fill: #5C2E44; }
      .linea { stroke: #E3D3DB; stroke-width: 1; }
      .acento { fill: #E93456; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #150911; }
        .txt { fill: #F5E9EE; }
        .txt-sec { fill: #D9B8C8; }
        .linea { stroke: #3A2530; }
      }
    </style>
  </defs>

  <rect width="680" height="440" class="bg"/>

  <text x="30" y="32" font-size="14" font-weight="700" class="txt">Escala tipográfica del polideportivo</text>
  <text x="30" y="50" font-size="11" class="txt-sec">Base de 16 px, proporción 1,25 y valores redondeados a múltiplos de 4 · tamaño / altura de línea</text>

  <!-- Cabeceras -->
  <text x="30" y="78" font-size="10" font-weight="600" class="txt-sec">TOKEN</text>
  <text x="150" y="78" font-size="10" font-weight="600" class="txt-sec">TAMAÑO</text>
  <text x="230" y="78" font-size="10" font-weight="600" class="txt-sec">EJEMPLO</text>
  <line x1="30" y1="86" x2="650" y2="86" class="linea"/>

  <!-- display -->
  <text x="30" y="128" font-size="12" class="txt mono">display</text>
  <text x="150" y="128" font-size="12" class="txt-sec mono">40 / 48</text>
  <text x="230" y="131" font-size="40" font-weight="700" class="txt">Reserva tu pista</text>
  <line x1="30" y1="148" x2="650" y2="148" class="linea"/>

  <!-- heading-1 -->
  <text x="30" y="180" font-size="12" class="txt mono">heading-1</text>
  <text x="150" y="180" font-size="12" class="txt-sec mono">32 / 40</text>
  <text x="230" y="183" font-size="32" font-weight="700" class="txt">Pistas de pádel</text>
  <line x1="30" y1="198" x2="650" y2="198" class="linea"/>

  <!-- heading-2 -->
  <text x="30" y="226" font-size="12" class="txt mono">heading-2</text>
  <text x="150" y="226" font-size="12" class="txt-sec mono">24 / 32</text>
  <text x="230" y="229" font-size="24" font-weight="600" class="txt">Horas libres hoy</text>
  <line x1="30" y1="242" x2="650" y2="242" class="linea"/>

  <!-- heading-3 -->
  <text x="30" y="268" font-size="12" class="txt mono">heading-3</text>
  <text x="150" y="268" font-size="12" class="txt-sec mono">20 / 28</text>
  <text x="230" y="270" font-size="20" font-weight="600" class="txt">Pista 3 · cubierta</text>
  <line x1="30" y1="284" x2="650" y2="284" class="linea"/>

  <!-- body -->
  <text x="30" y="310" font-size="12" class="txt mono">body</text>
  <text x="150" y="310" font-size="12" class="txt-sec mono">16 / 24</text>
  <text x="230" y="311" font-size="16" class="txt">Puedes cancelar sin coste hasta 24 horas antes.</text>
  <line x1="30" y1="326" x2="650" y2="326" class="linea"/>

  <!-- label -->
  <text x="30" y="350" font-size="12" class="txt mono">label</text>
  <text x="150" y="350" font-size="12" class="txt-sec mono">14 / 20</text>
  <text x="230" y="351" font-size="14" font-weight="600" class="txt">Fecha de la reserva</text>
  <line x1="30" y1="364" x2="650" y2="364" class="linea"/>

  <!-- caption -->
  <text x="30" y="388" font-size="12" class="txt mono">caption</text>
  <text x="150" y="388" font-size="12" class="txt-sec mono">14 / 20</text>
  <text x="230" y="389" font-size="14" class="txt-sec">Precio con descuento de abonado incluido</text>
  <line x1="30" y1="402" x2="650" y2="402" class="linea"/>

  <rect x="30" y="416" width="10" height="10" rx="2" class="acento"/>
  <text x="46" y="425" font-size="11" class="txt-sec">Ningún texto de la interfaz baja de 14 px, y el texto de lectura se queda en 16 px.</text>
</svg>
