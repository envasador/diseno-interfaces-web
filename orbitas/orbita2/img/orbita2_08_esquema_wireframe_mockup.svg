<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Del wireframe en grises al mockup en modo claro y oscuro, y las páginas en que se organiza el archivo de Figma</title>
  <defs>
    <style>
      .bg  { fill: #ffffff; }
      .txt { fill: #1F0318; }
      .txt-sec { fill: #5C2E44; }
      .sombra { fill: #1F0318; }
      .marco { stroke: #1F0318; stroke-width: 1.5; }
      .pagina { fill: #ffffff; stroke: #1F0318; stroke-width: 1.2; }
      .pagina-sel { fill: #FFB8DE; stroke: #1F0318; stroke-width: 1.2; }
      .flecha { stroke: #E93456; stroke-width: 2; fill: none; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #150911; }
        .txt { fill: #F5E9EE; }
        .txt-sec { fill: #D9B8C8; }
        .sombra { fill: #000000; }
        .marco { stroke: #F5E9EE; }
        .pagina { fill: #2A1620; stroke: #F5E9EE; }
        .pagina-sel { fill: #5C2E44; stroke: #F5E9EE; }
      }
    </style>
    <marker id="pt9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#E93456" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="400" class="bg"/>

  <!-- 1. Wireframe -->
  <text x="80" y="30" text-anchor="middle" font-size="12" font-weight="700" class="txt">Wireframe</text>
  <rect x="34" y="44" width="96" height="180" rx="10" class="sombra"/>
  <rect x="30" y="40" width="96" height="180" rx="10" fill="#FFFFFF" class="marco"/>
  <rect x="40" y="54" width="60" height="8" fill="#555555"/>
  <rect x="40" y="70" width="76" height="40" fill="#BBBBBB"/>
  <line x1="40" y1="70" x2="116" y2="110" stroke="#555555" stroke-width="1"/>
  <line x1="116" y1="70" x2="40" y2="110" stroke="#555555" stroke-width="1"/>
  <rect x="40" y="118" width="70" height="4" fill="#888888"/>
  <rect x="40" y="126" width="56" height="4" fill="#888888"/>
  <rect x="40" y="140" width="76" height="26" fill="#BBBBBB"/>
  <rect x="40" y="184" width="76" height="20" fill="#555555"/>
  <text x="78" y="240" text-anchor="middle" font-size="10" class="txt-sec">Órbita 1</text>

  <path d="M136 130 L 164 130" class="flecha" marker-end="url(#pt9)"/>

  <!-- 2. Sistema -->
  <text x="236" y="30" text-anchor="middle" font-size="12" font-weight="700" class="txt">Sistema</text>
  <rect x="174" y="40" width="124" height="180" rx="8" class="pagina"/>
  <rect x="186" y="54" width="16" height="16" rx="3" fill="#1A5FB4"/>
  <rect x="206" y="54" width="16" height="16" rx="3" fill="#99C1F1"/>
  <rect x="226" y="54" width="16" height="16" rx="3" fill="#0E6B6B"/>
  <rect x="246" y="54" width="16" height="16" rx="3" fill="#C42B2B"/>
  <rect x="266" y="54" width="16" height="16" rx="3" fill="#F2B21B"/>
  <text x="186" y="96" font-size="18" font-weight="700" class="txt">Aa</text>
  <text x="214" y="96" font-size="13" font-weight="600" class="txt">Aa</text>
  <text x="236" y="96" font-size="10" class="txt">Aa</text>
  <rect x="186" y="112" width="4" height="10" fill="#E93456"/>
  <rect x="194" y="112" width="8" height="10" fill="#E93456"/>
  <rect x="206" y="112" width="16" height="10" fill="#E93456"/>
  <rect x="226" y="112" width="32" height="10" fill="#E93456"/>
  <rect x="186" y="140" width="96" height="26" rx="6" fill="#1A5FB4"/>
  <text x="234" y="157" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">Reservar</text>
  <rect x="186" y="176" width="96" height="26" rx="4" fill="#FFFFFF" stroke="#5E5D68" stroke-width="1.2"/>
  <text x="236" y="240" text-anchor="middle" font-size="10" class="txt-sec">Apartados 2 a 8</text>

  <path d="M304 130 L 332 130" class="flecha" marker-end="url(#pt9)"/>

  <!-- 3. Mockup claro -->
  <text x="390" y="30" text-anchor="middle" font-size="12" font-weight="700" class="txt">Mockup claro</text>
  <rect x="346" y="44" width="96" height="180" rx="10" class="sombra"/>
  <rect x="342" y="40" width="96" height="180" rx="10" fill="#F7F7F8" class="marco"/>
  <rect x="352" y="54" width="60" height="8" rx="2" fill="#1C1B22"/>
  <rect x="352" y="70" width="76" height="70" rx="6" fill="#FFFFFF" stroke="#D9D9DE"/>
  <rect x="358" y="76" width="64" height="30" rx="3" fill="#99C1F1"/>
  <rect x="358" y="112" width="44" height="5" rx="2" fill="#1C1B22"/>
  <rect x="358" y="122" width="34" height="4" rx="2" fill="#5E5D68"/>
  <rect x="352" y="148" width="76" height="22" rx="6" fill="#FFFFFF" stroke="#D9D9DE"/>
  <rect x="352" y="184" width="76" height="20" rx="6" fill="#1A5FB4"/>

  <!-- 4. Mockup oscuro -->
  <text x="530" y="30" text-anchor="middle" font-size="12" font-weight="700" class="txt">Mockup oscuro</text>
  <rect x="486" y="44" width="96" height="180" rx="10" class="sombra"/>
  <rect x="482" y="40" width="96" height="180" rx="10" fill="#1C1B22" class="marco"/>
  <rect x="492" y="54" width="60" height="8" rx="2" fill="#F7F7F8"/>
  <rect x="492" y="70" width="76" height="70" rx="6" fill="#2E2D36"/>
  <rect x="498" y="76" width="64" height="30" rx="3" fill="#164F96"/>
  <rect x="498" y="112" width="44" height="5" rx="2" fill="#F7F7F8"/>
  <rect x="498" y="122" width="34" height="4" rx="2" fill="#9A99A3"/>
  <rect x="492" y="148" width="76" height="22" rx="6" fill="#2E2D36"/>
  <rect x="492" y="184" width="76" height="20" rx="6" fill="#99C1F1"/>
  <text x="460" y="240" text-anchor="middle" font-size="10" class="txt-sec">Apartado 9 · mismo nombre de frame que en el sitemap</text>

  <!-- Páginas del archivo -->
  <text x="30" y="290" font-size="12" font-weight="700" class="txt">Páginas del archivo de Figma</text>
  <g font-size="11">
    <rect x="30" y="304" width="110" height="34" rx="6" class="pagina"/>
    <text x="85" y="325" text-anchor="middle" class="txt">Portada</text>
    <rect x="152" y="304" width="110" height="34" rx="6" class="pagina-sel"/>
    <text x="207" y="325" text-anchor="middle" font-weight="700" class="txt">Guía de estilo</text>
    <rect x="274" y="304" width="110" height="34" rx="6" class="pagina-sel"/>
    <text x="329" y="325" text-anchor="middle" font-weight="700" class="txt">Componentes</text>
    <rect x="396" y="304" width="110" height="34" rx="6" class="pagina"/>
    <text x="451" y="325" text-anchor="middle" class="txt">Wireframes</text>
    <rect x="518" y="304" width="132" height="34" rx="6" class="pagina-sel"/>
    <text x="584" y="325" text-anchor="middle" font-weight="700" class="txt">Mockups</text>
  </g>
  <text x="30" y="362" font-size="11" class="txt-sec">Destacadas, las páginas que se crean o se rehacen en esta órbita. Los wireframes se conservan como quedaron en la Órbita 1.</text>
</svg>
