<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Cuándo un icono necesita etiqueta y proporciones de imagen definidas en el sistema</title>
  <defs>
    <style>
      .bg  { fill: #ffffff; }
      .txt { fill: #1F0318; }
      .txt-sec { fill: #5C2E44; }
      .marco { fill: #ffffff; stroke: #1F0318; stroke-width: 1.5; }
      .sombra { fill: #1F0318; }
      .ico { fill: none; stroke: #1F0318; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .img { fill: #C9B8C1; stroke: #1F0318; stroke-width: 1.2; }
      .ok { fill: #1E7A3C; }
      .ko { fill: #E93456; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #150911; }
        .txt { fill: #F5E9EE; }
        .txt-sec { fill: #D9B8C8; }
        .marco { fill: #2A1620; stroke: #F5E9EE; }
        .sombra { fill: #000000; }
        .ico { stroke: #F5E9EE; }
        .img { fill: #6E5563; stroke: #F5E9EE; }
        .ok { fill: #7FD39B; }
      }
    </style>
  </defs>

  <rect width="680" height="400" class="bg"/>

  <!-- ===== Iconos ===== -->
  <text x="30" y="32" font-size="13" font-weight="700" class="txt">¿Necesita etiqueta?</text>

  <!-- 1. Icono universal: lupa -->
  <rect x="34" y="54" width="56" height="56" rx="8" class="sombra"/>
  <rect x="30" y="50" width="56" height="56" rx="8" class="marco"/>
  <circle cx="55" cy="75" r="9" class="ico"/>
  <line x1="62" y1="82" x2="69" y2="89" class="ico"/>
  <text x="104" y="70" font-size="12" font-weight="600" class="txt">Buscar, cerrar, menú</text>
  <text x="104" y="86" font-size="11" class="txt-sec">Se entienden solos, pero en el código</text>
  <text x="104" y="100" font-size="11" class="txt-sec">llevan un nombre accesible.</text>

  <!-- 2. Icono + etiqueta -->
  <rect x="34" y="134" width="132" height="44" rx="8" class="sombra"/>
  <rect x="30" y="130" width="132" height="44" rx="8" class="marco"/>
  <path d="M46 144 h16 v16 h-16 z M46 149 h16 M51 141 v5 M57 141 v5" class="ico"/>
  <text x="72" y="157" font-size="13" font-weight="600" class="txt">Mis reservas</text>
  <text x="180" y="148" font-size="12" font-weight="600" class="txt">Icono con texto</text>
  <text x="180" y="164" font-size="11" class="txt-sec">La opción más clara para casi todo.</text>

  <!-- 3. Icono ambiguo sin etiqueta -->
  <rect x="34" y="202" width="56" height="56" rx="8" class="sombra"/>
  <rect x="30" y="198" width="56" height="56" rx="8" class="marco"/>
  <path d="M58 212 l4 9 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1 z" class="ico"/>
  <text x="104" y="218" font-size="12" font-weight="600" class="txt">¿Favoritos? ¿Valorar? ¿Destacar?</text>
  <text x="104" y="234" font-size="11" class="txt-sec">Si un icono admite varias lecturas,</text>
  <text x="104" y="248" font-size="11" class="txt-sec">necesita una etiqueta visible.</text>

  <text x="30" y="290" font-size="11" class="txt-sec">Todos los iconos salen de una sola librería,</text>
  <text x="30" y="305" font-size="11" class="txt-sec">con el mismo grosor de trazo y en tamaños</text>
  <text x="30" y="320" font-size="11" class="txt-sec">de la escala (16, 20 o 24 px).</text>

  <!-- ===== Imágenes ===== -->
  <text x="400" y="32" font-size="13" font-weight="700" class="txt">Proporciones de imagen</text>

  <rect x="400" y="52" width="160" height="90" rx="6" class="img"/>
  <text x="480" y="102" text-anchor="middle" font-size="14" font-weight="700" class="txt mono">16:9</text>
  <text x="572" y="88" font-size="11" class="txt-sec">Cabecera de</text>
  <text x="572" y="102" font-size="11" class="txt-sec">la pista</text>

  <rect x="400" y="160" width="120" height="90" rx="6" class="img"/>
  <text x="460" y="210" text-anchor="middle" font-size="14" font-weight="700" class="txt mono">4:3</text>
  <text x="532" y="200" font-size="11" class="txt-sec">Tarjeta de</text>
  <text x="532" y="214" font-size="11" class="txt-sec">la lista</text>

  <rect x="400" y="268" width="64" height="64" rx="32" class="img"/>
  <text x="432" y="305" text-anchor="middle" font-size="12" font-weight="700" class="txt mono">1:1</text>
  <text x="478" y="296" font-size="11" class="txt-sec">Avatar del</text>
  <text x="478" y="310" font-size="11" class="txt-sec">monitor</text>

  <text x="400" y="360" font-size="11" class="txt-sec">Cada imagen informativa lleva su texto alternativo,</text>
  <text x="400" y="375" font-size="11" class="txt-sec">que se decide al diseñar y no al programar.</text>
</svg>
