<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" font-family="system-ui, sans-serif">
  <title>Hoja de ruta de la Órbita 1 en siete pasos</title>
  <desc>Línea de tiempo con los siete pasos de la Órbita 1, sus horas y la cadena de trazabilidad entre artefactos.</desc>
  <defs>
    <marker id="arrowr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Línea base -->
  <line x1="60" y1="92" x2="620" y2="92" stroke="#B4B2A9" stroke-width="1"/>

  <!-- Paso 1 -->
  <circle cx="80" cy="92" r="6" fill="#534AB7"/>
  <text x="80" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">1</text>
  <text x="80" y="120" text-anchor="middle" font-size="11" fill="#444441">Hipótesis</text>
  <text x="80" y="134" text-anchor="middle" font-size="10" fill="#5F5E5A">2h</text>

  <!-- Paso 2 -->
  <circle cx="170" cy="92" r="6" fill="#534AB7"/>
  <text x="170" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">2</text>
  <text x="170" y="120" text-anchor="middle" font-size="11" fill="#444441">Referentes</text>
  <text x="170" y="134" text-anchor="middle" font-size="10" fill="#5F5E5A">3h · test 5s + encuesta</text>

  <!-- Paso 3 -->
  <circle cx="270" cy="92" r="6" fill="#534AB7"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">3</text>
  <text x="270" y="120" text-anchor="middle" font-size="11" fill="#444441">Entrevistas</text>
  <text x="270" y="134" text-anchor="middle" font-size="10" fill="#5F5E5A">4h · 5-6 personas</text>

  <!-- Paso 4 -->
  <circle cx="370" cy="92" r="6" fill="#534AB7"/>
  <text x="370" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">4</text>
  <text x="370" y="120" text-anchor="middle" font-size="11" fill="#444441">Personas</text>
  <text x="370" y="134" text-anchor="middle" font-size="10" fill="#5F5E5A">4h · affinity mapping</text>

  <!-- Paso 5 -->
  <circle cx="460" cy="92" r="6" fill="#534AB7"/>
  <text x="460" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">5</text>
  <text x="460" y="120" text-anchor="middle" font-size="11" fill="#444441">User flows</text>
  <text x="460" y="134" text-anchor="middle" font-size="10" fill="#5F5E5A">3h · tareas críticas</text>

  <!-- Paso 6 -->
  <circle cx="545" cy="92" r="6" fill="#534AB7"/>
  <text x="545" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">6</text>
  <text x="545" y="120" text-anchor="middle" font-size="11" fill="#444441">Sitemap</text>
  <text x="545" y="134" text-anchor="middle" font-size="10" fill="#5F5E5A">2h · card sorting</text>

  <!-- Paso 7 -->
  <circle cx="620" cy="92" r="6" fill="#0F6E56"/>
  <text x="620" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#085041">7</text>
  <text x="620" y="120" text-anchor="middle" font-size="11" fill="#444441">Brief y entrega</text>
  <text x="620" y="134" text-anchor="middle" font-size="10" fill="#5F5E5A">2h</text>

  <!-- Cadena de trazabilidad -->
  <rect x="60" y="176" width="560" height="118" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="84" y="202" font-size="12" font-weight="600" fill="#444441">Cadena de trazabilidad: ningún paso se cierra sin poder rastrearse hasta el anterior</text>

  <rect x="84" y="218" width="110" height="36" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.6"/>
  <text x="139" y="240" text-anchor="middle" font-size="11" fill="#444441">Personas reales</text>

  <rect x="234" y="218" width="100" height="36" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.6"/>
  <text x="284" y="240" text-anchor="middle" font-size="11" fill="#444441">Datos</text>

  <rect x="374" y="218" width="100" height="36" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.6"/>
  <text x="424" y="240" text-anchor="middle" font-size="11" fill="#444441">Personas</text>

  <rect x="514" y="218" width="90" height="36" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.6"/>
  <text x="559" y="240" text-anchor="middle" font-size="11" fill="#444441">Brief</text>

  <line x1="194" y1="236" x2="232" y2="236" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrowr)"/>
  <line x1="334" y1="236" x2="372" y2="236" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrowr)"/>
  <line x1="474" y1="236" x2="512" y2="236" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrowr)"/>

  <text x="340" y="280" text-anchor="middle" font-size="11" fill="#5F5E5A">El CHANGELOG.md de trazabilidad de IA acompaña todos los pasos desde el primero</text>
</svg>
