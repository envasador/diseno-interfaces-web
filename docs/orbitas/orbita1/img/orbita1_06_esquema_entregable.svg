<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" font-family="IBM Plex Sans, system-ui, sans-serif">
  <title>El entregable de la Órbita 1 como capa 0 del design system</title>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .txt { fill: #1F0318; }
      .contenedor { fill: #E93456; stroke: #1F0318; stroke-width: 2; }
      .artefacto { fill: #ffffff; stroke: #1F0318; stroke-width: 1.5; }
      .changelog { fill: #FFE156; stroke: #1F0318; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .destino { fill: #C42A48; stroke: #1F0318; stroke-width: 1.5; }
      .linea { stroke: #1F0318; stroke-width: 1.5; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #121212; }
        .txt { fill: #e0e0e0; }
        .artefacto { fill: #262626; stroke: #888888; stroke-width: 1.5; }
        .changelog { fill: #3a3000; stroke: #888888; stroke-width: 1.5; stroke-dasharray: 5 3; }
        .destino { fill: #7a1a28; stroke: #888888; stroke-width: 1.5; }
        .linea { stroke: #888888; stroke-width: 1.5; }
      }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1F0318" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="420" class="bg"/>

  <!-- Contenedor capa 0 -->
  <rect x="40" y="28" width="600" height="196" rx="10" class="contenedor"/>
  <text x="340" y="54" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Capa 0 — Investigación (Órbita 1)</text>
  <text x="340" y="72" text-anchor="middle" font-size="11" fill="#FFE156">FigJam · vinculada al Figma del proyecto</text>

  <!-- Artefactos -->
  <rect x="60" y="86" width="124" height="60" rx="6" class="artefacto"/>
  <text x="122" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#E93456">Brief</text>
  <text x="122" y="126" text-anchor="middle" font-size="10" class="txt">Problema · alcance</text>
  <text x="122" y="141" text-anchor="middle" font-size="10" class="txt">criterios de éxito</text>

  <rect x="202" y="86" width="124" height="60" rx="6" class="artefacto"/>
  <text x="264" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#E93456">Personas</text>
  <text x="264" y="126" text-anchor="middle" font-size="10" class="txt">2-3 perfiles</text>
  <text x="264" y="141" text-anchor="middle" font-size="10" class="txt">div. funcional incluida</text>

  <rect x="344" y="86" width="124" height="60" rx="6" class="artefacto"/>
  <text x="406" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#E93456">User flows</text>
  <text x="406" y="126" text-anchor="middle" font-size="10" class="txt">Happy path</text>
  <text x="406" y="141" text-anchor="middle" font-size="10" class="txt">+ casos límite</text>

  <rect x="486" y="86" width="124" height="60" rx="6" class="artefacto"/>
  <text x="548" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#E93456">Sitemap</text>
  <text x="548" y="126" text-anchor="middle" font-size="10" class="txt">Estructura</text>
  <text x="548" y="141" text-anchor="middle" font-size="10" class="txt">del producto</text>

  <!-- CHANGELOG -->
  <rect x="60" y="162" width="558" height="50" rx="6" class="changelog"/>
  <text x="339" y="183" text-anchor="middle" font-size="12" font-weight="700" class="txt">CHANGELOG.md</text>
  <text x="339" y="200" text-anchor="middle" font-size="10" class="txt">Trazabilidad de IA desde el primer día · GitHub</text>

  <!-- Flechas -->
  <line x1="264" y1="224" x2="196" y2="280" class="linea" marker-end="url(#arr)"/>
  <line x1="264" y1="224" x2="340" y2="280" class="linea" marker-end="url(#arr)"/>
  <line x1="406" y1="224" x2="480" y2="280" class="linea" marker-end="url(#arr)"/>
  <line x1="406" y1="224" x2="356" y2="280" class="linea" marker-end="url(#arr)"/>

  <!-- Destinos -->
  <rect x="96" y="280" width="190" height="64" rx="6" class="destino"/>
  <text x="191" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Órbitas 2-3</text>
  <text x="191" y="322" text-anchor="middle" font-size="10" fill="#ffffff">Tokens y breakpoints</text>
  <text x="191" y="337" text-anchor="middle" font-size="10" fill="#ffffff">justificados</text>

  <rect x="300" y="280" width="168" height="64" rx="6" class="destino"/>
  <text x="384" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Órbita 4</text>
  <text x="384" y="322" text-anchor="middle" font-size="10" fill="#ffffff">Accesibilidad guiada</text>
  <text x="384" y="337" text-anchor="middle" font-size="10" fill="#ffffff">por div. funcional</text>

  <rect x="482" y="280" width="160" height="64" rx="6" class="destino"/>
  <text x="562" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Órbita 5</text>
  <text x="562" y="322" text-anchor="middle" font-size="10" fill="#ffffff">Flows como guión</text>
  <text x="562" y="337" text-anchor="middle" font-size="10" fill="#ffffff">del walkthrough</text>

  <text x="340" y="378" text-anchor="middle" font-size="11" class="txt">Los criterios de éxito del brief son los tests de la Órbita 5</text>
</svg>
