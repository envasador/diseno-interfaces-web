<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="system-ui, sans-serif">
  <title>El entregable de la Órbita 1 como capa 0 del design system y sus conexiones con el resto del módulo</title>
  <desc>Diagrama que muestra los cuatro artefactos de la Órbita 1 dentro de la capa de investigación, y flechas que indican dónde se reutiliza cada uno en las órbitas posteriores.</desc>
  <defs>
    <marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Contenedor capa 0 -->
  <rect x="40" y="34" width="600" height="190" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="64" y="62" font-size="14" font-weight="600" fill="#3C3489">Capa 0 — Investigación (Órbita 1)</text>
  <text x="64" y="80" font-size="12" fill="#534AB7">Vive en FigJam, vinculada al Figma del proyecto</text>

  <!-- Artefactos -->
  <rect x="64" y="100" width="130" height="56" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.6"/>
  <text x="129" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Brief de proyecto</text>
  <text x="129" y="141" text-anchor="middle" font-size="11" fill="#534AB7">Problema · alcance · éxito</text>

  <rect x="212" y="100" width="130" height="56" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.6"/>
  <text x="277" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Personas</text>
  <text x="277" y="141" text-anchor="middle" font-size="11" fill="#534AB7">2-3, una con div. funcional</text>

  <rect x="360" y="100" width="130" height="56" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.6"/>
  <text x="425" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">User flows</text>
  <text x="425" y="141" text-anchor="middle" font-size="11" fill="#534AB7">Happy path + casos límite</text>

  <rect x="508" y="100" width="110" height="56" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.6"/>
  <text x="563" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Sitemap</text>
  <text x="563" y="141" text-anchor="middle" font-size="11" fill="#534AB7">Estructura del producto</text>

  <!-- CHANGELOG dentro de la capa -->
  <rect x="64" y="172" width="554" height="34" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.6" stroke-dasharray="5 3"/>
  <text x="341" y="193" text-anchor="middle" font-size="12" fill="#854F0B">CHANGELOG.md — trazabilidad de IA desde el primer día (GitHub)</text>

  <!-- Flechas hacia las órbitas -->
  <line x1="129" y1="156" x2="129" y2="172" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="277" y1="224" x2="200" y2="280" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrowg)"/>
  <line x1="277" y1="224" x2="340" y2="280" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrowg)"/>
  <line x1="425" y1="224" x2="480" y2="280" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrowg)"/>
  <line x1="425" y1="224" x2="356" y2="280" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrowg)"/>

  <!-- Destinos -->
  <rect x="110" y="280" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="200" y="302" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Órbitas 2-3</text>
  <text x="200" y="319" text-anchor="middle" font-size="11" fill="#0F6E56">Tokens, breakpoints y peso</text>
  <text x="200" y="332" text-anchor="middle" font-size="11" fill="#0F6E56">justificados con personas</text>

  <rect x="306" y="280" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="386" y="302" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Órbita 4</text>
  <text x="386" y="319" text-anchor="middle" font-size="11" fill="#0F6E56">Accesibilidad guiada por la</text>
  <text x="386" y="332" text-anchor="middle" font-size="11" fill="#0F6E56">persona con div. funcional</text>

  <rect x="482" y="280" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="562" y="302" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Órbita 5</text>
  <text x="562" y="319" text-anchor="middle" font-size="11" fill="#0F6E56">Flows como guión del</text>
  <text x="562" y="332" text-anchor="middle" font-size="11" fill="#0F6E56">cognitive walkthrough</text>

  <!-- Nota inferior -->
  <text x="340" y="376" text-anchor="middle" font-size="12" fill="#5F5E5A">Los criterios de éxito del brief se convierten en los tests de la Órbita 5</text>
</svg>
