<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" font-family="system-ui, sans-serif">
  <title>Ejemplo de user flow: compra como invitado con happy path y casos límite</title>
  <desc>Diagrama de flujo que muestra el recorrido de compra como invitado, con el happy path en vertical y dos casos límite bifurcando desde rombos de decisión.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Punto de entrada -->
  <rect x="60" y="30" width="180" height="48" rx="24" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="150" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Entrada</text>
  <text x="150" y="67" text-anchor="middle" font-size="12" fill="#534AB7">Enlace de producto</text>

  <!-- Pantalla producto -->
  <rect x="60" y="112" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="150" y="139" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Ficha de producto</text>
  <line x1="150" y1="78" x2="150" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Decisión: stock -->
  <polygon points="150,184 232,224 150,264 68,224" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.75"/>
  <text x="150" y="219" text-anchor="middle" font-size="12" fill="#854F0B">¿Hay stock</text>
  <text x="150" y="234" text-anchor="middle" font-size="12" fill="#854F0B">disponible?</text>
  <line x1="150" y1="156" x2="150" y2="182" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Caso límite: sin stock -->
  <rect x="340" y="200" width="220" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text x="450" y="220" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Aviso de disponibilidad</text>
  <text x="450" y="237" text-anchor="middle" font-size="12" fill="#993C1D">Caso límite: sin stock</text>
  <text x="282" y="214" text-anchor="middle" font-size="11" fill="#854F0B">No</text>
  <line x1="232" y1="224" x2="338" y2="224" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Carrito -->
  <rect x="60" y="296" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="150" y="323" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Carrito y pago</text>
  <text x="162" y="284" font-size="11" fill="#854F0B">Sí</text>
  <line x1="150" y1="264" x2="150" y2="294" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Decisión: pago -->
  <polygon points="150,368 232,408 150,448 68,408" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.75"/>
  <text x="150" y="403" text-anchor="middle" font-size="12" fill="#854F0B">¿Pago</text>
  <text x="150" y="418" text-anchor="middle" font-size="12" fill="#854F0B">correcto?</text>
  <line x1="150" y1="340" x2="150" y2="366" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Caso límite: pago fallido -->
  <rect x="340" y="384" width="220" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text x="450" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Reintento de pago</text>
  <text x="450" y="421" text-anchor="middle" font-size="12" fill="#993C1D">Caso límite: error o corte</text>
  <text x="282" y="398" text-anchor="middle" font-size="11" fill="#854F0B">No</text>
  <line x1="232" y1="408" x2="338" y2="408" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Vuelta del reintento al carrito -->
  <path d="M560 384 Q620 318 242 318" fill="none" stroke="#993C1D" stroke-width="0.75" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- Salida: éxito -->
  <rect x="60" y="478" width="180" height="36" rx="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="150" y="500" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Pedido confirmado</text>
  <text x="162" y="468" font-size="11" fill="#854F0B">Sí</text>
  <line x1="150" y1="448" x2="150" y2="476" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Leyenda -->
  <rect x="400" y="40" width="14" height="14" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="422" y="51" font-size="12" fill="#444441">Punto de entrada / salida</text>
  <rect x="400" y="64" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="422" y="75" font-size="12" fill="#444441">Pantalla o estado</text>
  <polygon points="407,88 414,95 407,102 400,95" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.75"/>
  <text x="422" y="99" font-size="12" fill="#444441">Decisión</text>
  <rect x="400" y="112" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text x="422" y="123" font-size="12" fill="#444441">Caso límite</text>
</svg>
