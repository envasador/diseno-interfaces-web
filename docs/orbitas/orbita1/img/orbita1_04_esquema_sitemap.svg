<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Ejemplo de sitemap con tres tipos de nodo y flujo superpuesto</title>
  <defs>
    <style>
      .bg  { fill: #ffffff; }
      .txt { fill: #1F0318; }
      .txt-inv { fill: #ffffff; }
      .sombra { fill: #1F0318; }
      .principal  { fill: #E93456; stroke: #1F0318; stroke-width: 1.5; }
      .secundaria { fill: #1F0318; stroke: #1F0318; stroke-width: 1.5; }
      .sistema    { fill: #FFB8DE; stroke: #1F0318; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .caja       { fill: #ffffff; stroke: #1F0318; stroke-width: 1; }
      .linea      { stroke: #1F0318; stroke-width: 1; }
      .flujo      { stroke: #E93456; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #150911; }
        .txt { fill: #F5E9EE; }
        .sombra { fill: #000000; }
        .principal  { fill: #E93456; stroke: #F5E9EE; }
        .secundaria { fill: #0A0409; stroke: #F5E9EE; }
        .sistema    { fill: #5C2E44; stroke: #F5E9EE; stroke-dasharray: 5 3; }
        .caja       { fill: #2A1620; stroke: #F5E9EE; }
        .linea      { stroke: #F5E9EE; }
        .flujo      { stroke: #E93456; }
      }
    </style>
    <marker id="arrflow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#E93456" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="440" class="bg"/>

  <!-- Jerarquía -->
  <line x1="340" y1="80" x2="340" y2="102" class="linea"/>
  <line x1="110" y1="102" x2="570" y2="102" class="linea"/>
  <line x1="110" y1="102" x2="110" y2="124" class="linea"/>
  <line x1="256" y1="102" x2="256" y2="124" class="linea"/>
  <line x1="424" y1="102" x2="424" y2="124" class="linea"/>
  <line x1="570" y1="102" x2="570" y2="124" class="linea"/>
  <line x1="110" y1="168" x2="110" y2="190" class="linea"/>
  <line x1="110" y1="234" x2="110" y2="256" class="linea"/>
  <line x1="424" y1="168" x2="350" y2="190" class="linea"/>
  <line x1="424" y1="168" x2="498" y2="190" class="linea"/>

  <!-- Home (con sombra dura) -->
  <rect x="274" y="40" width="140" height="44" rx="6" class="sombra"/>
  <rect x="270" y="36" width="140" height="44" rx="6" class="principal"/>
  <text x="340" y="63" text-anchor="middle" font-size="13" font-weight="700" class="txt-inv">Home</text>

  <!-- Nivel 1 (con sombra dura) -->
  <rect x="54"  y="128" width="120" height="44" rx="6" class="sombra"/>
  <rect x="50"  y="124" width="120" height="44" rx="6" class="principal"/>
  <text x="110" y="151" text-anchor="middle" font-size="12" font-weight="600" class="txt-inv">Catálogo</text>
  <rect x="200" y="128" width="120" height="44" rx="6" class="sombra"/>
  <rect x="196" y="124" width="120" height="44" rx="6" class="principal"/>
  <text x="256" y="151" text-anchor="middle" font-size="12" font-weight="600" class="txt-inv">Ofertas</text>
  <rect x="368" y="128" width="120" height="44" rx="6" class="sombra"/>
  <rect x="364" y="124" width="120" height="44" rx="6" class="principal"/>
  <text x="424" y="151" text-anchor="middle" font-size="12" font-weight="600" class="txt-inv">Mi cuenta</text>
  <rect x="514" y="128" width="120" height="44" rx="6" class="sombra"/>
  <rect x="510" y="124" width="120" height="44" rx="6" class="principal"/>
  <text x="570" y="151" text-anchor="middle" font-size="12" font-weight="600" class="txt-inv">Ayuda</text>

  <!-- Nivel 2 (con sombra dura) -->
  <rect x="54"  y="194" width="120" height="44" rx="6" class="sombra"/>
  <rect x="50"  y="190" width="120" height="44" rx="6" class="secundaria"/>
  <text x="110" y="208" text-anchor="middle" font-size="11" font-weight="600" class="txt-inv">Ficha de</text>
  <text x="110" y="224" text-anchor="middle" font-size="11" class="txt-inv">producto</text>

  <rect x="54"  y="260" width="120" height="44" rx="6" class="sombra"/>
  <rect x="50"  y="256" width="120" height="44" rx="6" class="secundaria"/>
  <text x="110" y="274" text-anchor="middle" font-size="11" font-weight="600" class="txt-inv">Carrito y</text>
  <text x="110" y="290" text-anchor="middle" font-size="11" class="txt-inv">pago</text>

  <rect x="294" y="194" width="120" height="44" rx="6" class="sombra"/>
  <rect x="290" y="190" width="120" height="44" rx="6" class="secundaria"/>
  <text x="350" y="208" text-anchor="middle" font-size="11" font-weight="600" class="txt-inv">Mis</text>
  <text x="350" y="224" text-anchor="middle" font-size="11" class="txt-inv">pedidos</text>

  <rect x="442" y="194" width="120" height="44" rx="6" class="sombra"/>
  <rect x="438" y="190" width="120" height="44" rx="6" class="secundaria"/>
  <text x="498" y="208" text-anchor="middle" font-size="11" font-weight="600" class="txt-inv">Mis</text>
  <text x="498" y="224" text-anchor="middle" font-size="11" class="txt-inv">datos</text>

  <!-- Sistema -->
  <rect x="510" y="256" width="120" height="40" rx="6" class="sistema"/>
  <text x="570" y="274" text-anchor="middle" font-size="11" font-weight="600" class="txt">Login /</text>
  <text x="570" y="288" text-anchor="middle" font-size="10" class="txt">registro</text>

  <rect x="510" y="308" width="120" height="40" rx="6" class="sistema"/>
  <text x="570" y="326" text-anchor="middle" font-size="11" font-weight="600" class="txt">Error /</text>
  <text x="570" y="340" text-anchor="middle" font-size="10" class="txt">confirmación</text>

  <!-- Flujo -->
  <path d="M270 58 Q60 58 60 124"  class="flujo" marker-end="url(#arrflow)"/>
  <path d="M60 168 Q44 178 50 190" class="flujo" marker-end="url(#arrflow)"/>
  <path d="M60 234 Q44 244 50 256" class="flujo" marker-end="url(#arrflow)"/>
  <text x="28" y="228" text-anchor="middle" font-size="10" fill="#E93456" font-weight="600" transform="rotate(-90 28 228)">Flujo compra</text>

  <!-- Leyenda -->
  <rect x="40" y="374" width="600" height="56" rx="6" class="caja"/>
  <rect x="60"  y="386" width="14" height="14" rx="3" class="principal"/>
  <text x="82"  y="397" font-size="10" class="txt">Pantalla principal</text>
  <rect x="210" y="386" width="14" height="14" rx="3" class="secundaria"/>
  <text x="232" y="397" font-size="10" class="txt">Pantalla secundaria</text>
  <rect x="380" y="386" width="14" height="14" rx="3" class="sistema"/>
  <text x="402" y="397" font-size="10" class="txt">Pantalla de sistema</text>
  <line x1="60" y1="418" x2="90" y2="418" class="flujo"/>
  <text x="100" y="422" font-size="10" class="txt">User flow superpuesto</text>
</svg>
