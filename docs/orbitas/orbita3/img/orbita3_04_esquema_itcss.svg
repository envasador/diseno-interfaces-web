<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" role="img" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Las siete capas de ITCSS en un triángulo invertido: Settings, Tools, Generic, Elements, Objects, Components y Utilities. De arriba abajo el alcance baja y la especificidad y la explicitud suben</title>
<defs><style>
.bg{fill:#ffffff}.txt{fill:#1F0318}.txt-sec{fill:#5C2E44}.sombra{fill:#1F0318}
.caja{fill:#ffffff;stroke:#1F0318;stroke-width:1.5}.sem{fill:#FFB8DE;stroke:#1F0318;stroke-width:1.5}
.suave{fill:#FFE3F1;stroke:#1F0318;stroke-width:1.5}.borde{fill:none;stroke:#1F0318;stroke-width:6}
.discont{fill:none;stroke:#1F0318;stroke-width:1.5;stroke-dasharray:6 4}
.flecha{stroke:#E93456;stroke-width:2;fill:none}.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){.bg{fill:#150911}.txt{fill:#F5E9EE}.txt-sec{fill:#D9B8C8}.sombra{fill:#000000}
.caja{fill:#2A1620;stroke:#F5E9EE}.sem{fill:#5C2E44;stroke:#F5E9EE}.suave{fill:#3A1F2D;stroke:#F5E9EE}.borde{stroke:#F5E9EE}.discont{stroke:#F5E9EE}}
</style>
<marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E93456" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="392" class="bg"/>
<polygon points="20.0,30 440.0,30 420.7142857142857,76 39.28571428571428,76" class="caja"/>
<text x="230" y="50" text-anchor="middle" font-size="12.5" font-weight="700" class="txt">Settings</text>
<text x="230" y="65" text-anchor="middle" font-size="10" class="txt-sec mono">tokens y breakpoints</text>
<polygon points="39.28571428571428,76 420.7142857142857,76 401.42857142857144,122 58.571428571428555,122" class="caja"/>
<text x="230" y="96" text-anchor="middle" font-size="12.5" font-weight="700" class="txt">Tools</text>
<text x="230" y="111" text-anchor="middle" font-size="10" class="txt-sec mono">funciones y mixins</text>
<polygon points="58.571428571428555,122 401.42857142857144,122 382.1428571428571,168 77.85714285714286,168" class="suave"/>
<text x="230" y="142" text-anchor="middle" font-size="12.5" font-weight="700" class="txt">Generic</text>
<text x="230" y="157" text-anchor="middle" font-size="10" class="txt-sec mono">reset</text>
<polygon points="77.85714285714286,168 382.1428571428571,168 362.8571428571429,214 97.14285714285714,214" class="suave"/>
<text x="230" y="188" text-anchor="middle" font-size="12.5" font-weight="700" class="txt">Elements</text>
<text x="230" y="203" text-anchor="middle" font-size="10" class="txt-sec mono">h1, a, body</text>
<polygon points="97.14285714285714,214 362.8571428571429,214 343.57142857142856,260 116.42857142857143,260" class="sem"/>
<text x="230" y="234" text-anchor="middle" font-size="12.5" font-weight="700" class="txt">Objects</text>
<text x="230" y="249" text-anchor="middle" font-size="10" class="txt-sec mono">.o-stack, .o-grid</text>
<polygon points="116.42857142857143,260 343.57142857142856,260 324.2857142857143,306 135.71428571428572,306" class="sem"/>
<text x="230" y="280" text-anchor="middle" font-size="12.5" font-weight="700" class="txt">Components</text>
<text x="230" y="295" text-anchor="middle" font-size="10" class="txt-sec mono">.button, .card</text>
<polygon points="135.71428571428572,306 324.2857142857143,306 305.0,352 155.0,352" class="suave"/>
<text x="230" y="326" text-anchor="middle" font-size="12.5" font-weight="700" class="txt">Utilities</text>
<text x="230" y="341" text-anchor="middle" font-size="10" class="txt-sec mono">.u-visually-hidden</text>
<text x="230" y="378" text-anchor="middle" font-size="10.5" class="txt-sec">Settings y Tools no generan CSS</text>
<path d="M480 50 L 480 352" class="flecha" marker-end="url(#punta)"/>
<text x="496" y="70" font-size="12.5" font-weight="700" class="txt">De arriba abajo</text>
<rect x="500" y="108" width="166" height="54" rx="6" class="sombra"/><rect x="496" y="104" width="166" height="54" rx="6" class="caja"/>
<text x="506" y="125" font-size="11.5" font-weight="700" class="txt">El alcance baja</text><text x="506" y="141" font-size="10" class="txt-sec">del documento entero a</text><text x="506" y="154" font-size="10" class="txt-sec">un solo elemento</text>
<rect x="500" y="190" width="166" height="54" rx="6" class="sombra"/><rect x="496" y="186" width="166" height="54" rx="6" class="caja"/>
<text x="506" y="207" font-size="11.5" font-weight="700" class="txt">La especificidad sube</text><text x="506" y="223" font-size="10" class="txt-sec">de selectores de etiqueta</text><text x="506" y="236" font-size="10" class="txt-sec">a clases</text>
<rect x="500" y="272" width="166" height="54" rx="6" class="sombra"/><rect x="496" y="268" width="166" height="54" rx="6" class="caja"/>
<text x="506" y="289" font-size="11.5" font-weight="700" class="txt">La explicitud sube</text><text x="506" y="305" font-size="10" class="txt-sec">de lo genérico</text><text x="506" y="318" font-size="10" class="txt-sec">a lo muy concreto</text>
</svg>