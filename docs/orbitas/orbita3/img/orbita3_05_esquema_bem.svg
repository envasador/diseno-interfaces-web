<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>La tarjeta de pista con sus nombres de BEM: el bloque card, los elementos card__media, card__title, card__price y card__meta, el modificador card--featured y otros bloques dentro, como badge y button</title>
<defs><style>
.bg{fill:#ffffff}.txt{fill:#1F0318}.txt-sec{fill:#5C2E44}.sombra{fill:#1F0318}
.caja{fill:#ffffff;stroke:#1F0318;stroke-width:1.5}.sem{fill:#FFB8DE;stroke:#1F0318;stroke-width:1.5}
.suave{fill:#FFE3F1;stroke:#1F0318;stroke-width:1.5}.borde{fill:none;stroke:#1F0318;stroke-width:6}
.discont{fill:none;stroke:#1F0318;stroke-width:1.5;stroke-dasharray:6 4}
.flecha{stroke:#E93456;stroke-width:2;fill:none}.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){.bg{fill:#150911}.txt{fill:#F5E9EE}.txt-sec{fill:#D9B8C8}.sombra{fill:#000000}
.caja{fill:#2A1620;stroke:#F5E9EE}.sem{fill:#5C2E44;stroke:#F5E9EE}.suave{fill:#3A1F2D;stroke:#F5E9EE}.borde{stroke:#F5E9EE}.discont{stroke:#F5E9EE}}
</style>
<marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E93456" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="360" class="bg"/>
<rect x="44" y="44" width="300" height="300" rx="10" class="sombra"/>
<rect x="40" y="40" width="300" height="300" rx="10" class="caja"/>
<rect x="40" y="40" width="300" height="300" rx="10" fill="none" stroke="#E93456" stroke-width="3"/>
<rect x="56" y="56" width="268" height="130" rx="6" class="suave"/>
<text x="190" y="126" text-anchor="middle" font-size="11" class="txt-sec">foto de la pista</text>
<text x="56" y="214" font-size="15" font-weight="700" class="txt">Pista de pádel 2</text>
<text x="324" y="214" text-anchor="end" font-size="12" font-weight="700" class="txt">8 € / hora</text>
<text x="56" y="240" font-size="11" class="txt-sec">Cubierta · Iluminación incluida</text>
<rect x="56" y="256" width="62" height="24" rx="12" fill="none" stroke="#1A7F4B" stroke-width="2"/>
<text x="87" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#1A7F4B">Libre</text>
<rect x="56" y="292" width="268" height="34" rx="6" fill="#1A5FB4"/>
<text x="190" y="313" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Ver horarios</text>
<text x="40" y="28" font-size="12.5" font-weight="700" class="txt mono">.card  (bloque)</text>
<path d="M352 56 L 382 56" class="flecha" marker-end="url(#punta)"/>
<text x="394" y="54" font-size="12" font-weight="700" class="txt mono">.card--featured</text><text x="394" y="69" font-size="10.5" class="txt-sec">modificador: la variante destacada</text>
<path d="M330 121 L 382 121" class="flecha" marker-end="url(#punta)"/>
<text x="394" y="119" font-size="12" font-weight="700" class="txt mono">.card__media</text><text x="394" y="134" font-size="10.5" class="txt-sec">elemento</text>
<path d="M330 209 L 382 186" class="flecha" marker-end="url(#punta)"/>
<text x="394" y="184" font-size="12" font-weight="700" class="txt mono">.card__title · .card__price</text><text x="394" y="199" font-size="10.5" class="txt-sec">elementos</text>
<path d="M330 236 L 382 226" class="flecha" marker-end="url(#punta)"/>
<text x="394" y="224" font-size="12" font-weight="700" class="txt mono">.card__meta</text><text x="394" y="239" font-size="10.5" class="txt-sec">elemento</text>
<path d="M330 268 L 382 266" class="flecha" marker-end="url(#punta)"/>
<text x="394" y="264" font-size="12" font-weight="700" class="txt mono">.badge .badge--free</text><text x="394" y="279" font-size="10.5" class="txt-sec">otro bloque dentro, con su modificador</text>
<path d="M330 309 L 382 309" class="flecha" marker-end="url(#punta)"/>
<text x="394" y="307" font-size="12" font-weight="700" class="txt mono">.button .button--block</text><text x="394" y="322" font-size="10.5" class="txt-sec">otro bloque dentro</text>
</svg>