<svg xmlns="http://www.w3.org/2000/svg" width="680" height="366" viewBox="0 0 680 366" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Cómo elegir el formato de una imagen: fotografía en AVIF o WebP, iconos y logotipos en SVG, capturas con texto en PNG o WebP sin pérdida y animaciones en vídeo o con un sprite de CSS</title>
<defs><style>
.bg{fill:#ffffff}.txt{fill:#1F0318}.txt-sec{fill:#5C2E44}.sombra{fill:#1F0318}
.caja{fill:#ffffff;stroke:#1F0318;stroke-width:1.5}.sem{fill:#FFB8DE;stroke:#1F0318;stroke-width:1.5}
.suave{fill:#FFE3F1;stroke:#1F0318;stroke-width:1.5}.borde{fill:none;stroke:#1F0318;stroke-width:6}
.discont{fill:none;stroke:#1F0318;stroke-width:1.5;stroke-dasharray:6 4}
.flecha{stroke:#E93456;stroke-width:2;fill:none}.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){.bg{fill:#150911}.txt{fill:#F5E9EE}.txt-sec{fill:#D9B8C8}.sombra{fill:#000000}
.caja{fill:#2A1620;stroke:#F5E9EE}.sem{fill:#5C2E44;stroke:#F5E9EE}.suave{fill:#3A1F2D;stroke:#F5E9EE}.borde{stroke:#F5E9EE}.discont{stroke:#F5E9EE}}
</style>
<marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E93456" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="366" class="bg"/>
<text x="40" y="36" font-size="14" font-weight="700" class="txt">¿Qué es la imagen?</text>
<text x="440" y="36" font-size="14" font-weight="700" class="txt">Formato</text>
<rect x="44" y="60" width="320" height="48" rx="6" class="sombra"/><rect x="40" y="56" width="320" height="48" rx="6" class="caja"/>
<text x="52" y="85" font-size="11.5" class="txt">Una fotografía</text>
<path d="M368 80 L 418 80" class="flecha" marker-end="url(#punta)"/>
<rect x="434" y="60" width="206" height="48" rx="6" class="sombra"/><rect x="430" y="56" width="206" height="48" rx="6" class="sem"/>
<text x="442" y="77" font-size="12.5" font-weight="700" class="txt">AVIF o WebP</text>
<text x="442" y="94" font-size="10.5" class="txt-sec">JPEG como reserva</text>
<rect x="44" y="130" width="320" height="48" rx="6" class="sombra"/><rect x="40" y="126" width="320" height="48" rx="6" class="caja"/>
<text x="52" y="155" font-size="11.5" class="txt">Un icono, un logotipo o una ilustración plana</text>
<path d="M368 150 L 418 150" class="flecha" marker-end="url(#punta)"/>
<rect x="434" y="130" width="206" height="48" rx="6" class="sombra"/><rect x="430" y="126" width="206" height="48" rx="6" class="sem"/>
<text x="442" y="147" font-size="12.5" font-weight="700" class="txt">SVG</text>
<text x="442" y="164" font-size="10.5" class="txt-sec">optimizado con SVGOMG</text>
<rect x="44" y="200" width="320" height="48" rx="6" class="sombra"/><rect x="40" y="196" width="320" height="48" rx="6" class="caja"/>
<text x="52" y="225" font-size="11.5" class="txt">Una captura con texto o una imagen con transparencia</text>
<path d="M368 220 L 418 220" class="flecha" marker-end="url(#punta)"/>
<rect x="434" y="200" width="206" height="48" rx="6" class="sombra"/><rect x="430" y="196" width="206" height="48" rx="6" class="sem"/>
<text x="442" y="217" font-size="12.5" font-weight="700" class="txt">PNG o WebP sin pérdida</text>
<rect x="44" y="270" width="320" height="48" rx="6" class="sombra"/><rect x="40" y="266" width="320" height="48" rx="6" class="caja"/>
<text x="52" y="295" font-size="11.5" class="txt">Una animación</text>
<path d="M368 290 L 418 290" class="flecha" marker-end="url(#punta)"/>
<rect x="434" y="270" width="206" height="48" rx="6" class="sombra"/><rect x="430" y="266" width="206" height="48" rx="6" class="sem"/>
<text x="442" y="287" font-size="12.5" font-weight="700" class="txt">Vídeo MP4 o WebM</text>
<text x="442" y="304" font-size="10.5" class="txt-sec">o un sprite con CSS; nunca GIF</text>
<text x="40" y="350" font-size="11" class="txt-sec">Después: exporta al doble del tamaño con el que se ve, comprime con Squoosh y comprueba el peso.</text>
</svg>