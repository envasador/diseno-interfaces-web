<svg xmlns="http://www.w3.org/2000/svg" width="680" height="404" viewBox="0 0 680 404" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Cada pieza del sistema de diseño en Figma tiene una herramienta de CSS que la implementa: variables primitivas y semánticas como propiedades personalizadas, estilos de texto como tokens de fuente en rem, Auto layout como Flexbox, layout grid como Grid y variantes de estado como pseudoclases</title>
<defs><style>
.bg{fill:#ffffff}.txt{fill:#1F0318}.txt-sec{fill:#5C2E44}.sombra{fill:#1F0318}
.caja{fill:#ffffff;stroke:#1F0318;stroke-width:1.5}.sem{fill:#FFB8DE;stroke:#1F0318;stroke-width:1.5}
.flecha{stroke:#E93456;stroke-width:2;fill:none}.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){.bg{fill:#150911}.txt{fill:#F5E9EE}.txt-sec{fill:#D9B8C8}.sombra{fill:#000000}
.caja{fill:#2A1620;stroke:#F5E9EE}.sem{fill:#5C2E44;stroke:#F5E9EE}}
</style>
<marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E93456" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="404" class="bg"/>
<text x="135" y="44" text-anchor="middle" font-size="14" font-weight="700" class="txt">En Figma</text>
<text x="135" y="60" text-anchor="middle" font-size="11" class="txt-sec">lo que decidiste en la Órbita 2</text>
<text x="470" y="44" text-anchor="middle" font-size="14" font-weight="700" class="txt">En CSS</text>
<text x="470" y="60" text-anchor="middle" font-size="11" class="txt-sec">cómo se escribe en la Órbita 3</text>
<rect x="34" y="84" width="210" height="38" rx="6" class="sombra"/><rect x="30" y="80" width="210" height="38" rx="6" class="sem"/>
<text x="42" y="96" font-size="12" font-weight="700" class="txt">Variables primitivas</text><text x="42" y="111" font-size="10.5" class="txt-sec">Colección de un solo modo</text>
<path d="M252 99 L 284 99" class="flecha" marker-end="url(#punta)"/>
<rect x="300" y="84" width="350" height="38" rx="6" class="sombra"/><rect x="296" y="80" width="350" height="38" rx="6" class="caja"/>
<text x="308" y="103" font-size="11.5" class="txt mono">:root { --blue-500: #1A5FB4; }</text>
<rect x="34" y="132" width="210" height="38" rx="6" class="sombra"/><rect x="30" y="128" width="210" height="38" rx="6" class="sem"/>
<text x="42" y="144" font-size="12" font-weight="700" class="txt">Variables semánticas</text><text x="42" y="159" font-size="10.5" class="txt-sec">Modos claro y oscuro</text>
<path d="M252 147 L 284 147" class="flecha" marker-end="url(#punta)"/>
<rect x="300" y="132" width="350" height="38" rx="6" class="sombra"/><rect x="296" y="128" width="350" height="38" rx="6" class="caja"/>
<text x="308" y="151" font-size="11.5" class="txt mono">--color-primary: light-dark(…);</text>
<rect x="34" y="180" width="210" height="38" rx="6" class="sombra"/><rect x="30" y="176" width="210" height="38" rx="6" class="sem"/>
<text x="42" y="192" font-size="12" font-weight="700" class="txt">Estilos de texto</text><text x="42" y="207" font-size="10.5" class="txt-sec">Escala de 6 a 8 niveles</text>
<path d="M252 195 L 284 195" class="flecha" marker-end="url(#punta)"/>
<rect x="300" y="180" width="350" height="38" rx="6" class="sombra"/><rect x="296" y="176" width="350" height="38" rx="6" class="caja"/>
<text x="308" y="199" font-size="11.5" class="txt mono">font: var(--font-body);  /* rem */</text>
<rect x="34" y="228" width="210" height="38" rx="6" class="sombra"/><rect x="30" y="224" width="210" height="38" rx="6" class="sem"/>
<text x="42" y="240" font-size="12" font-weight="700" class="txt">Auto layout</text><text x="42" y="255" font-size="10.5" class="txt-sec">Dirección, espaciado, relleno</text>
<path d="M252 243 L 284 243" class="flecha" marker-end="url(#punta)"/>
<rect x="300" y="228" width="350" height="38" rx="6" class="sombra"/><rect x="296" y="224" width="350" height="38" rx="6" class="caja"/>
<text x="308" y="247" font-size="11.5" class="txt mono">display: flex; gap: var(--space-2);</text>
<rect x="34" y="276" width="210" height="38" rx="6" class="sombra"/><rect x="30" y="272" width="210" height="38" rx="6" class="sem"/>
<text x="42" y="288" font-size="12" font-weight="700" class="txt">Layout grid</text><text x="42" y="303" font-size="10.5" class="txt-sec">Columnas, medianil, margen</text>
<path d="M252 291 L 284 291" class="flecha" marker-end="url(#punta)"/>
<rect x="300" y="276" width="350" height="38" rx="6" class="sombra"/><rect x="296" y="272" width="350" height="38" rx="6" class="caja"/>
<text x="308" y="295" font-size="11.5" class="txt mono">display: grid; grid-template-columns: …</text>
<rect x="34" y="324" width="210" height="38" rx="6" class="sombra"/><rect x="30" y="320" width="210" height="38" rx="6" class="sem"/>
<text x="42" y="336" font-size="12" font-weight="700" class="txt">Variantes de estado</text><text x="42" y="351" font-size="10.5" class="txt-sec">Hover, foco, desactivado…</text>
<path d="M252 339 L 284 339" class="flecha" marker-end="url(#punta)"/>
<rect x="300" y="324" width="350" height="38" rx="6" class="sombra"/><rect x="296" y="320" width="350" height="38" rx="6" class="caja"/>
<text x="308" y="343" font-size="11.5" class="txt mono">:hover  :focus-visible  :disabled</text>
</svg>