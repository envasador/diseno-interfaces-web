<svg xmlns="http://www.w3.org/2000/svg" width="680" height="312" viewBox="0 0 680 312" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Los seis pasos para construir un componente: partir de Figma, escribir el HTML, poner los nombres de BEM, aplicar los tokens, añadir los estados y comprobarlo en los dos modos, con teclado, con la letra al 200 % y en móvil</title>
<defs><style>
.bg{fill:#ffffff}.txt{fill:#1F0318}.txt-sec{fill:#5C2E44}.sombra{fill:#1F0318}
.caja{fill:#ffffff;stroke:#1F0318;stroke-width:1.5}.sem{fill:#FFB8DE;stroke:#1F0318;stroke-width:1.5}
.suave{fill:#FFE3F1;stroke:#1F0318;stroke-width:1.5}.borde{fill:none;stroke:#1F0318;stroke-width:6}
.discont{fill:none;stroke:#1F0318;stroke-width:1.5;stroke-dasharray:6 4}
.flecha{stroke:#E93456;stroke-width:2;fill:none}.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){.bg{fill:#150911}.txt{fill:#F5E9EE}.txt-sec{fill:#D9B8C8}.sombra{fill:#000000}
.caja{fill:#2A1620;stroke:#F5E9EE}.sem{fill:#5C2E44;stroke:#F5E9EE}.suave{fill:#3A1F2D;stroke:#F5E9EE}.borde{stroke:#F5E9EE}.discont{stroke:#F5E9EE}}
</style>
<marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E93456" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="312" class="bg"/>
<rect x="34" y="44" width="190" height="84" rx="8" class="sombra"/><rect x="30" y="40" width="190" height="84" rx="8" class="sem"/>
<circle cx="54" cy="66" r="13" fill="#E93456"/><text x="54" y="71" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
<text x="76" y="71" font-size="14" font-weight="700" class="txt">Figma</text>
<text x="44" y="102" font-size="10.5" class="txt-sec">anatomía, variantes y estados</text>
<path d="M226 82 L 242 82" class="flecha" marker-end="url(#punta)"/>
<rect x="249" y="44" width="190" height="84" rx="8" class="sombra"/><rect x="245" y="40" width="190" height="84" rx="8" class="caja"/>
<circle cx="269" cy="66" r="13" fill="#E93456"/><text x="269" y="71" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
<text x="291" y="71" font-size="14" font-weight="700" class="txt">HTML</text>
<text x="259" y="102" font-size="10.5" class="txt-sec">el elemento correcto</text>
<path d="M441 82 L 457 82" class="flecha" marker-end="url(#punta)"/>
<rect x="464" y="44" width="190" height="84" rx="8" class="sombra"/><rect x="460" y="40" width="190" height="84" rx="8" class="caja"/>
<circle cx="484" cy="66" r="13" fill="#E93456"/><text x="484" y="71" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
<text x="506" y="71" font-size="14" font-weight="700" class="txt">BEM</text>
<text x="474" y="102" font-size="10.5" class="txt-sec">bloque, elementos, modificadores</text>
<rect x="34" y="174" width="190" height="84" rx="8" class="sombra"/><rect x="30" y="170" width="190" height="84" rx="8" class="caja"/>
<circle cx="54" cy="196" r="13" fill="#E93456"/><text x="54" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
<text x="76" y="201" font-size="14" font-weight="700" class="txt">Tokens</text>
<text x="44" y="232" font-size="10.5" class="txt-sec">solo semánticos y de componente</text>
<path d="M226 212 L 242 212" class="flecha" marker-end="url(#punta)"/>
<rect x="249" y="174" width="190" height="84" rx="8" class="sombra"/><rect x="245" y="170" width="190" height="84" rx="8" class="caja"/>
<circle cx="269" cy="196" r="13" fill="#E93456"/><text x="269" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
<text x="291" y="201" font-size="14" font-weight="700" class="txt">Estados</text>
<text x="259" y="232" font-size="10.5" class="txt-sec">pseudoclases y atributos</text>
<path d="M441 212 L 457 212" class="flecha" marker-end="url(#punta)"/>
<rect x="464" y="174" width="190" height="84" rx="8" class="sombra"/><rect x="460" y="170" width="190" height="84" rx="8" class="sem"/>
<circle cx="484" cy="196" r="13" fill="#E93456"/><text x="484" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>
<text x="506" y="201" font-size="14" font-weight="700" class="txt">Comprobar</text>
<text x="474" y="232" font-size="10.5" class="txt-sec">modos, teclado, 200 %, móvil</text>
<path d="M550 132 C 550 152, 125 148, 125 166" class="flecha" marker-end="url(#punta)"/>
<text x="30" y="296" font-size="11" class="txt-sec">Si algo falla en el paso 6, vuelve al paso que corresponda y, si es una decisión de diseño, cámbiala también en Figma.</text>
</svg>