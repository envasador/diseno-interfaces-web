<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Hoja de ruta de la Órbita 2 en ocho pasos, de preparar el archivo a entregar los mockups y la guía de estilo</title>
  <defs>
    <style>
      .bg  { fill: #ffffff; }
      .txt { fill: #1F0318; }
      .txt-sec { fill: #5C2E44; }
      .txt-inv { fill: #ffffff; }
      .sombra { fill: #1F0318; }
      .paso { fill: #ffffff; stroke: #1F0318; stroke-width: 1.5; }
      .num { fill: #E93456; }
      .camino { stroke: #E93456; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      .semana { fill: #5C2E44; font-weight: 700; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #150911; }
        .txt { fill: #F5E9EE; }
        .txt-sec { fill: #D9B8C8; }
        .sombra { fill: #000000; }
        .paso { fill: #2A1620; stroke: #F5E9EE; }
        .semana { fill: #D9B8C8; }
      }
    </style>
  </defs>

  <rect width="680" height="340" class="bg"/>

  <!-- Camino -->
  <path d="M100 110 H 580 C 640 110, 640 230, 580 230 H 100" class="camino"/>

  <!-- Fila 1 -->
  <g font-size="11">
    <rect x="34" y="64" width="132" height="92" rx="8" class="sombra"/>
    <rect x="30" y="60" width="132" height="92" rx="8" class="paso"/>
    <circle cx="52" cy="82" r="12" class="num"/><text x="52" y="86" text-anchor="middle" font-weight="700" class="txt-inv">1</text>
    <text x="42" y="112" font-weight="700" class="txt">Prepara el archivo</text>
    <text x="42" y="128" class="txt-sec">y haz el inventario</text>
    <text x="42" y="142" class="txt-sec">de decisiones</text>

    <rect x="190" y="64" width="132" height="92" rx="8" class="sombra"/>
    <rect x="186" y="60" width="132" height="92" rx="8" class="paso"/>
    <circle cx="208" cy="82" r="12" class="num"/><text x="208" y="86" text-anchor="middle" font-weight="700" class="txt-inv">2</text>
    <text x="198" y="112" font-weight="700" class="txt">Replantea</text>
    <text x="198" y="128" class="txt-sec">la jerarquía y</text>
    <text x="198" y="142" class="txt-sec">rediseña wireframes</text>

    <rect x="346" y="64" width="132" height="92" rx="8" class="sombra"/>
    <rect x="342" y="60" width="132" height="92" rx="8" class="paso"/>
    <circle cx="364" cy="82" r="12" class="num"/><text x="364" y="86" text-anchor="middle" font-weight="700" class="txt-inv">3</text>
    <text x="354" y="112" font-weight="700" class="txt">Construye el color</text>
    <text x="354" y="128" class="txt-sec">paleta, escalas,</text>
    <text x="354" y="142" class="txt-sec">tokens y contraste</text>

    <rect x="502" y="64" width="132" height="92" rx="8" class="sombra"/>
    <rect x="498" y="60" width="132" height="92" rx="8" class="paso"/>
    <circle cx="520" cy="82" r="12" class="num"/><text x="520" y="86" text-anchor="middle" font-weight="700" class="txt-inv">4</text>
    <text x="510" y="112" font-weight="700" class="txt">Elige la tipografía</text>
    <text x="510" y="128" class="txt-sec">y define la escala</text>
    <text x="510" y="142" class="txt-sec">de niveles</text>
  </g>

  <!-- Fila 2 (de derecha a izquierda) -->
  <g font-size="11">
    <rect x="502" y="184" width="132" height="92" rx="8" class="sombra"/>
    <rect x="498" y="180" width="132" height="92" rx="8" class="paso"/>
    <circle cx="520" cy="202" r="12" class="num"/><text x="520" y="206" text-anchor="middle" font-weight="700" class="txt-inv">5</text>
    <text x="510" y="232" font-weight="700" class="txt">Fija el espaciado</text>
    <text x="510" y="248" class="txt-sec">retícula, radios</text>
    <text x="510" y="262" class="txt-sec">y elevación</text>

    <rect x="346" y="184" width="132" height="92" rx="8" class="sombra"/>
    <rect x="342" y="180" width="132" height="92" rx="8" class="paso"/>
    <circle cx="364" cy="202" r="12" class="num"/><text x="364" y="206" text-anchor="middle" font-weight="700" class="txt-inv">6</text>
    <text x="354" y="232" font-weight="700" class="txt">Iconos, imágenes</text>
    <text x="354" y="248" class="txt-sec">y patrones de tus</text>
    <text x="354" y="262" class="txt-sec">componentes</text>

    <rect x="190" y="184" width="132" height="92" rx="8" class="sombra"/>
    <rect x="186" y="180" width="132" height="92" rx="8" class="paso"/>
    <circle cx="208" cy="202" r="12" class="num"/><text x="208" y="206" text-anchor="middle" font-weight="700" class="txt-inv">7</text>
    <text x="198" y="232" font-weight="700" class="txt">Crea las variables</text>
    <text x="198" y="248" class="txt-sec">y los componentes</text>
    <text x="198" y="262" class="txt-sec">en Figma</text>

    <rect x="34" y="184" width="132" height="92" rx="8" class="sombra"/>
    <rect x="30" y="180" width="132" height="92" rx="8" class="paso"/>
    <circle cx="52" cy="202" r="12" class="num"/><text x="52" y="206" text-anchor="middle" font-weight="700" class="txt-inv">8</text>
    <text x="42" y="232" font-weight="700" class="txt">Mockups, guía</text>
    <text x="42" y="248" class="txt-sec">de estilo y entrega</text>
  </g>

  <!-- Semanas -->
  <text x="30" y="40" font-size="11" class="semana">SEMANA 5 · pasos 1 a 3</text>
  <text x="498" y="40" font-size="11" class="semana">SEMANA 6 · pasos 4 a 6</text>
  <text x="30" y="306" font-size="11" class="semana">SEMANA 7 · pasos 7 y 8</text>
</svg>
