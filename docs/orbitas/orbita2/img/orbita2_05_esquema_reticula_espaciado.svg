<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Retícula de cuatro columnas en un móvil de 360 píxeles con márgenes y medianiles de 16, una tarjeta con su relleno interior, la escala de espaciado y el tamaño mínimo de un objetivo táctil</title>
  <defs>
    <style>
      .bg  { fill: #ffffff; }
      .txt { fill: #1F0318; }
      .txt-sec { fill: #5C2E44; }
      .marco { fill: #ffffff; stroke: #1F0318; stroke-width: 1.5; }
      .sombra { fill: #1F0318; }
      .col { fill: #FFB8DE; opacity: 0.55; }
      .el { fill: #1F0318; }
      .el-suave { fill: #C9B8C1; }
      .tarjeta { fill: #ffffff; stroke: #1F0318; stroke-width: 1.2; }
      .acento { fill: #E93456; }
      .cota { stroke: #E93456; stroke-width: 1.2; }
      .barra { fill: #E93456; }
      .zona { fill: none; stroke: #E93456; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #150911; }
        .txt { fill: #F5E9EE; }
        .txt-sec { fill: #D9B8C8; }
        .marco { fill: #2A1620; stroke: #F5E9EE; }
        .sombra { fill: #000000; }
        .col { fill: #5C2E44; opacity: 0.8; }
        .el { fill: #F5E9EE; }
        .el-suave { fill: #6E5563; }
        .tarjeta { fill: #2A1620; stroke: #F5E9EE; }
      }
    </style>
  </defs>

  <rect width="680" height="460" class="bg"/>

  <!-- ===== Móvil con retícula (escala 1:2) ===== -->
  <text x="40" y="30" font-size="13" font-weight="700" class="txt">Retícula de 4 columnas (móvil, 360 px)</text>
  <rect x="44" y="48" width="180" height="370" rx="14" class="sombra"/>
  <rect x="40" y="44" width="180" height="370" rx="14" class="marco"/>
  <!-- columnas: margen 8, columna 35, medianil 8 (escala 1:2 de 16 / 70 / 16) -->
  <rect x="48"  y="44" width="35" height="370" class="col"/>
  <rect x="91"  y="44" width="35" height="370" class="col"/>
  <rect x="134" y="44" width="35" height="370" class="col"/>
  <rect x="177" y="44" width="35" height="370" class="col"/>

  <!-- título -->
  <rect x="48" y="70" width="120" height="12" rx="2" class="el"/>
  <!-- tarjeta que ocupa las 4 columnas -->
  <rect x="48" y="98" width="164" height="132" rx="6" class="tarjeta"/>
  <rect x="56" y="106" width="148" height="56" rx="3" class="el-suave"/>
  <rect x="56" y="170" width="90" height="8" rx="2" class="el"/>
  <rect x="56" y="184" width="70" height="5" rx="2" class="el-suave"/>
  <rect x="56" y="200" width="148" height="22" rx="4" class="acento"/>
  <!-- dos tarjetas de 2 columnas -->
  <rect x="48" y="246" width="78" height="96" rx="6" class="tarjeta"/>
  <rect x="134" y="246" width="78" height="96" rx="6" class="tarjeta"/>
  <rect x="56" y="254" width="62" height="40" rx="3" class="el-suave"/>
  <rect x="142" y="254" width="62" height="40" rx="3" class="el-suave"/>
  <rect x="56" y="302" width="48" height="7" rx="2" class="el"/>
  <rect x="142" y="302" width="44" height="7" rx="2" class="el"/>

  <!-- cotas -->
  <line x1="40" y1="430" x2="48" y2="430" class="cota"/>
  <text x="44" y="446" text-anchor="middle" font-size="10" class="txt-sec">16</text>
  <line x1="83" y1="430" x2="91" y2="430" class="cota"/>
  <text x="87" y="446" text-anchor="middle" font-size="10" class="txt-sec">16</text>
  <text x="140" y="446" font-size="10" class="txt-sec">margen y medianil</text>
  <line x1="200" y1="106" x2="212" y2="106" class="cota"/>
  <text x="228" y="110" font-size="10" class="txt-sec">relleno 16</text>
  <line x1="220" y1="230" x2="220" y2="246" class="cota"/>
  <text x="228" y="242" font-size="10" class="txt-sec">separación 16</text>

  <!-- ===== Escala de espaciado ===== -->
  <text x="330" y="30" font-size="13" font-weight="700" class="txt">Escala de espaciado (base 4)</text>
  <g font-size="11">
    <text x="330" y="62" class="txt mono">space-1</text><rect x="420" y="53" width="8" height="12" class="barra"/><text x="436" y="63" class="txt-sec">4 px</text>
    <text x="330" y="86" class="txt mono">space-2</text><rect x="420" y="77" width="16" height="12" class="barra"/><text x="444" y="87" class="txt-sec">8 px</text>
    <text x="330" y="110" class="txt mono">space-3</text><rect x="420" y="101" width="24" height="12" class="barra"/><text x="452" y="111" class="txt-sec">12 px</text>
    <text x="330" y="134" class="txt mono">space-4</text><rect x="420" y="125" width="32" height="12" class="barra"/><text x="460" y="135" class="txt-sec">16 px</text>
    <text x="330" y="158" class="txt mono">space-6</text><rect x="420" y="149" width="48" height="12" class="barra"/><text x="476" y="159" class="txt-sec">24 px</text>
    <text x="330" y="182" class="txt mono">space-8</text><rect x="420" y="173" width="64" height="12" class="barra"/><text x="492" y="183" class="txt-sec">32 px</text>
    <text x="330" y="206" class="txt mono">space-12</text><rect x="420" y="197" width="96" height="12" class="barra"/><text x="524" y="207" class="txt-sec">48 px</text>
    <text x="330" y="230" class="txt mono">space-16</text><rect x="420" y="221" width="128" height="12" class="barra"/><text x="556" y="231" class="txt-sec">64 px</text>
  </g>

  <!-- ===== Objetivo táctil ===== -->
  <text x="330" y="290" font-size="13" font-weight="700" class="txt">Objetivo táctil</text>
  <rect x="330" y="306" width="88" height="88" rx="6" class="zona"/>
  <rect x="350" y="326" width="48" height="48" rx="6" class="el"/>
  <text x="374" y="410" text-anchor="middle" font-size="10" class="txt-sec">icono de 24 px</text>
  <text x="374" y="423" text-anchor="middle" font-size="10" class="txt-sec">zona de 44 × 44 px</text>
  <text x="440" y="330" font-size="11" class="txt">La zona que responde al toque</text>
  <text x="440" y="346" font-size="11" class="txt">es mayor que el dibujo del icono.</text>
  <text x="440" y="370" font-size="11" class="txt-sec">WCAG 2.2 pide un mínimo de 24 × 24</text>
  <text x="440" y="386" font-size="11" class="txt-sec">(nivel AA); en este módulo, 44 × 44</text>
  <text x="440" y="402" font-size="11" class="txt-sec">para los elementos principales.</text>
</svg>
