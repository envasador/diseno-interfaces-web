<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Escala de azules del 50 al 900 con el contraste de cada tono frente al texto blanco y frente al texto oscuro; solo los tonos 500 a 900 superan 4,5:1 con texto blanco y solo los tonos 50 a 300 lo superan con texto oscuro</title>
  <defs>
    <style>
      .bg  { fill: #ffffff; }
      .txt { fill: #1F0318; }
      .txt-sec { fill: #5C2E44; }
      .ok  { fill: #1F0318; font-weight: 700; }
      .ko  { fill: #A08A96; }
      .marco { stroke: #1F0318; stroke-width: 1.5; fill: none; }
      .linea { stroke: #1F0318; stroke-width: 1; }
      .marca { stroke: #E93456; stroke-width: 2.5; fill: none; }
      .marca-txt { fill: #E93456; font-weight: 700; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #150911; }
        .txt { fill: #F5E9EE; }
        .txt-sec { fill: #D9B8C8; }
        .ok { fill: #F5E9EE; }
        .ko { fill: #7A6470; }
        .marco { stroke: #F5E9EE; }
        .linea { stroke: #F5E9EE; }
      }
    </style>
  </defs>

  <rect width="680" height="300" class="bg"/>

  <text x="40" y="34" font-size="14" font-weight="700" class="txt">Escala de azules y contraste con el texto</text>
  <text x="40" y="52" font-size="11" class="txt-sec">En negrita, los tonos que alcanzan el mínimo de 4,5:1 para texto normal (WCAG nivel AA)</text>

  <!-- Muestras -->
  <g stroke="#1F0318" stroke-width="1">
    <rect x="100" y="70" width="54" height="64" fill="#EEF4FC"/>
    <rect x="154" y="70" width="54" height="64" fill="#D7E5F8"/>
    <rect x="208" y="70" width="54" height="64" fill="#99C1F1"/>
    <rect x="262" y="70" width="54" height="64" fill="#6FA3E6"/>
    <rect x="316" y="70" width="54" height="64" fill="#3F80D6"/>
    <rect x="370" y="70" width="54" height="64" fill="#1A5FB4"/>
    <rect x="424" y="70" width="54" height="64" fill="#164F96"/>
    <rect x="478" y="70" width="54" height="64" fill="#134079"/>
    <rect x="532" y="70" width="54" height="64" fill="#10325E"/>
    <rect x="586" y="70" width="54" height="64" fill="#0C2443"/>
  </g>
  <!-- "Aa" dentro de cada muestra con el texto que pasa -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <text x="127" y="108" fill="#1C1B22">Aa</text>
    <text x="181" y="108" fill="#1C1B22">Aa</text>
    <text x="235" y="108" fill="#1C1B22">Aa</text>
    <text x="289" y="108" fill="#1C1B22">Aa</text>
    <text x="343" y="108" fill="#FFFFFF">Aa</text>
    <text x="397" y="108" fill="#FFFFFF">Aa</text>
    <text x="451" y="108" fill="#FFFFFF">Aa</text>
    <text x="505" y="108" fill="#FFFFFF">Aa</text>
    <text x="559" y="108" fill="#FFFFFF">Aa</text>
    <text x="613" y="108" fill="#FFFFFF">Aa</text>
  </g>

  <!-- Nombres de los pasos -->
  <g font-size="11" text-anchor="middle" class="mono">
    <text x="127" y="152" class="txt">50</text>
    <text x="181" y="152" class="txt">100</text>
    <text x="235" y="152" class="txt">200</text>
    <text x="289" y="152" class="txt">300</text>
    <text x="343" y="152" class="txt">400</text>
    <text x="397" y="152" class="txt">500</text>
    <text x="451" y="152" class="txt">600</text>
    <text x="505" y="152" class="txt">700</text>
    <text x="559" y="152" class="txt">800</text>
    <text x="613" y="152" class="txt">900</text>
  </g>

  <line x1="40" y1="164" x2="640" y2="164" class="linea"/>

  <!-- Contraste con texto blanco -->
  <text x="40" y="186" font-size="11" class="txt">Texto</text>
  <text x="40" y="199" font-size="11" class="txt">blanco</text>
  <g font-size="12" text-anchor="middle">
    <text x="127" y="193" class="ko">1,11</text>
    <text x="181" y="193" class="ko">1,28</text>
    <text x="235" y="193" class="ko">1,87</text>
    <text x="289" y="193" class="ko">2,61</text>
    <text x="343" y="193" class="ko">3,98</text>
    <text x="397" y="193" class="ok">6,29</text>
    <text x="451" y="193" class="ok">8,10</text>
    <text x="505" y="193" class="ok">10,31</text>
    <text x="559" y="193" class="ok">12,81</text>
    <text x="613" y="193" class="ok">15,57</text>
  </g>

  <!-- Contraste con texto oscuro -->
  <text x="40" y="221" font-size="11" class="txt">Texto</text>
  <text x="40" y="234" font-size="11" class="txt">oscuro</text>
  <g font-size="12" text-anchor="middle">
    <text x="127" y="228" class="ok">15,44</text>
    <text x="181" y="228" class="ok">13,38</text>
    <text x="235" y="228" class="ok">9,15</text>
    <text x="289" y="228" class="ok">6,55</text>
    <text x="343" y="228" class="ko">4,29</text>
    <text x="397" y="228" class="ko">2,72</text>
    <text x="451" y="228" class="ko">2,11</text>
    <text x="505" y="228" class="ko">1,66</text>
    <text x="559" y="228" class="ko">1,33</text>
    <text x="613" y="228" class="ko">1,10</text>
  </g>

  <!-- Marcas de los tonos elegidos -->
  <rect x="206" y="66" width="58" height="72" rx="3" class="marca"/>
  <rect x="368" y="66" width="58" height="72" rx="3" class="marca"/>
  <text x="235" y="262" text-anchor="middle" font-size="11" class="marca-txt">color-primary</text>
  <text x="235" y="276" text-anchor="middle" font-size="11" class="marca-txt">modo oscuro</text>
  <text x="397" y="262" text-anchor="middle" font-size="11" class="marca-txt">color-primary</text>
  <text x="397" y="276" text-anchor="middle" font-size="11" class="marca-txt">modo claro</text>
</svg>
