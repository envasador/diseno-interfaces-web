  <text x="30" y="262" font-size="11" class="txt-sec">El círculo sigue el tono de HSL: 0° rojo, 120° verde, 240° azul. Las armonías dan un punto de partida;</text>
  <text x="30" y="278" font-size="11" class="txt-sec">en una interfaz, uno de los colores domina y los demás acompañan en pequeñas dosis.</text>
